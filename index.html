function pSubs(){return S.subs.map(sb=>{const ps=S.preps.filter(p=>p.sub===sb.id&&(!q||p.name.toLowerCase().includes(q)));return`<div class="card" style="border-style:dashed"><div class="row"><b>${esc(sb.name)}</b><button class="b" onclick="subRen('${sb.id}')">Rinomina</button><button class="b" onclick="addPrep('${sb.id}')">+ Aggiungi</button><button class="x" title="Elimina sottocategoria" onclick="subDel('${sb.id}')">✕</button></div>${ps.map(pCard).join('')||'<div class="mu">Nessuna voce: premi «+ Aggiungi».</div>'}</div>`}).join('')+`<div class="row"><button class="b" onclick="addSub()">+ Nuova sottocategoria</button></div>`}
function pCard(p){const n=lotsOf('prep',p.id).length;return`<details class="card" ${open_===p.id?'open':''} ontoggle="if(this.open)open_='${p.id}'"><summary><b>${esc(p.name)}</b><span class="mu">${n} ${n===1?'lotto':'lotti'}</span></summary><div class="row" style="margin-top:8px"><label>Nome <input value="${esc(p.name)}" onchange="S.preps.find(x=>x.id==='${p.id}').name=cap(this.value);R()"></label></div>${tracBlock('prep',p.id)}<div class="row" style="margin-top:8px"><button class="b" onclick="ask('Eliminare questa voce e i suoi lotti?',()=>{delLots('prep','${p.id}');S.preps=S.preps.filter(x=>x.id!=='${p.id}');R()})">Elimina voce</button></div></details>`}
function addPrep(sid){askText('Nome della voce (es. Ragù, Besciamella)',n=>{const p={id:'q'+Date.now(),sub:sid,name:cap(n)};S.preps.push(p);open_=p.id;R()})}
function addSub(){askText('Nome della sottocategoria',n=>{S.subs.push({id:'s'+Date.now(),name:cap(n)});R()})}
function subRen(id){askText('Nuovo nome della sottocategoria',n=>{S.subs.find(x=>x.id===id).name=cap(n);R()})}

// ===== HACCP: temperature frigo e sanificazione =====
let hsub='trac',tday='',tfr='',tmsg='',tcfg=false;
const HS=[['trac','Tracciabilità'],['temp','Temperature frigo'],['san','Sanificazione']];
const lim=(v,d)=>v===''||v==null||isNaN(+v)?d:+v;
const tOut=(f,v)=>+v<lim(f.min,-Infinity)||+v>lim(f.max,Infinity);
const hasT=v=>v!==undefined&&v!==null&&v!=='';
const opSel=(id,cur,none)=>'<select id="'+id+'">'+(none?'<option value="">— nessuno —</option>':'')+Array.from({length:10},(_,i)=>'<option value="'+i+'" '+(cur!==''&&cur!=null&&+cur===i?'selected':'')+'>'+(i+1)+' · '+esc(opN(i))+'</option>').join('')+'</select>';
function pHaccp(){const chips=`<div class="chips">${HS.map(([k,t])=>`<button class="${hsub===k?'on':''}" onclick="hsub='${k}';R()">${t}</button>`).join('')}</div>`;return chips+(hsub==='temp'?pTemp():hsub==='san'?pSan():pTrac())}
function addFrigo(){if(S.frigos.length>=20)return note('Puoi inserire al massimo 20 frigoriferi.');askText('Nome del frigorifero (es. Frigo banco, Cella)',n=>{S.frigos.push({id:'fr'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:cap(n),min:0,max:4});R()})}
function delFrigo(id){const f=S.frigos.find(x=>x.id===id);ask('Eliminare «'+f.name+'» e tutte le sue temperature registrate?',()=>{Object.keys(S.temps).forEach(d=>{delete S.temps[d][id];if(!Object.keys(S.temps[d]).length)delete S.temps[d];const k=d+'|'+id;if(S.tfoto[k]){FOTO.del(S.tfoto[k]);delete S.tfoto[k]}});S.frigos=S.frigos.filter(x=>x.id!==id);R()})}
function setTemp(id,v){if(v!==''&&isNaN(+v))return;const T=S.temps[tday]||(S.temps[tday]={});if(v==='')delete T[id];else T[id]=Math.round(+v*10)/10;if(!Object.keys(T).length)delete S.temps[tday];R()}
async function tFoto(id,inp){const f=inp.files[0];inp.value='';if(!f)return;tmsg='Carico la foto…';R();const k=tday+'|'+id,day=tday;try{const d=await shrink(f),pid='tf'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);await FOTO.put(pid,d);if(S.tfoto[k])FOTO.del(S.tfoto[k]);S.tfoto[k]=pid;tmsg=''}catch(e){tmsg=e.message&&e.message.startsWith('Foto')?e.message:'Impossibile salvare la foto: controlla la connessione.'}R()}
function tFotoDel(id){const k=tday+'|'+id;if(S.tfoto[k]){FOTO.del(S.tfoto[k]);delete S.tfoto[k]}R()}
function pTemp(){if(!tday)tday=td();const fr=S.frigos,T=S.temps[tday]||{};
const done=fr.filter(f=>hasT(T[f.id])).length,bad=fr.filter(f=>hasT(T[f.id])&&tOut(f,T[f.id])).length;
const rows=fr.map(f=>{const v=T[f.id],h=hasT(v),out=h&&tOut(f,v),pid=S.tfoto[tday+'|'+f.id];
return`<tr><td><b>${esc(f.name)}</b><div class="mu">limiti ${lim(f.min,'–')} … ${lim(f.max,'–')} °C</div></td><td><input type="number" step="0.1" style="width:84px" value="${h?v:''}" placeholder="°C" onchange="setTemp('${f.id}',this.value)"> °C ${h?(out?'<b class="bad">fuori limite</b>':'<span class="ok">ok</span>'):''}</td><td>${pid?fImg(pid)+`<button class="x" title="Togli foto" onclick="tFotoDel('${f.id}')">✕</button>`:`<label class="b" style="cursor:pointer">📷 Foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="tFoto('${f.id}',this)"></label>`}</td></tr>`}).join('');
const cfg=fr.map(f=>`<tr><td><input value="${esc(f.name)}" onchange="S.frigos.find(x=>x.id==='${f.id}').name=cap(this.value);R()"></td><td><input type="number" step="0.5" style="width:70px" value="${f.min??''}" onchange="S.frigos.find(x=>x.id==='${f.id}').min=this.value===''?'':+this.value;R()"></td><td><input type="number" step="0.5" style="width:70px" value="${f.max??''}" onchange="S.frigos.find(x=>x.id==='${f.id}').max=this.value===''?'':+this.value;R()"></td><td><button class="x" onclick="delFrigo('${f.id}')">✕</button></td></tr>`).join('');
const hist=[];Object.keys(S.temps).sort().reverse().forEach(d=>fr.filter(f=>!tfr||f.id===tfr).forEach(f=>{const v=S.temps[d][f.id];if(hasT(v))hist.push({d,f,v})}));
const hr=hist.slice(0,80).map(x=>{const o=tOut(x.f,x.v),pid=S.tfoto[x.d+'|'+x.f.id];return`<tr><td>${fd(x.d)}</td><td>${esc(x.f.name)}</td><td>${o?'<b class="bad">':'<b>'}${String(x.v).replace('.',',')} °C</b></td><td>${o?'<b class="bad">fuori limite</b>':'<span class="ok">ok</span>'}</td><td>${pid?fImg(pid):''}</td><td>${hasT(S.top[x.d])?esc(opN(S.top[x.d])):''}</td></tr>`}).join('');
return`<div class="card"><b>Temperature frigo</b><div class="mu">Registra ogni giorno la temperatura di ogni frigorifero, con la foto del display. Fuori dai limiti il valore diventa rosso.</div></div>
<div class="row"><label>Giorno <input type="date" value="${tday}" max="${td()}" onchange="tday=this.value||td();R()"></label><label>Operatore ${opSel('top',S.top[tday],true).replace('<select id="top"','<select id="top" onchange="if(this.value===\'\')delete S.top[tday];else S.top[tday]=+this.value;R()"')}</label><span class="mu">${fr.length?done+' di '+fr.length+' registrate'+(bad?' · <b class="bad">'+bad+' fuori limite</b>':''):''}</span></div>
${tmsg?'<div class="mu">'+esc(tmsg)+'</div>':''}
${fr.length?`<div class="card sc"><table><tr><th>Frigorifero</th><th>Temperatura</th><th>Foto</th></tr>${rows}</table></div>`:'<div class="card mu">Nessun frigorifero: premi «+ Aggiungi frigo».</div>'}
<div class="row"><button class="b" onclick="addFrigo()">+ Aggiungi frigo (${fr.length}/20)</button></div>
${fr.length?`<details class="card" ${tcfg?'open':''} ontoggle="tcfg=this.open"><summary><b>Nomi e limiti dei frigoriferi</b></summary><div class="sc"><table><tr><th>Nome</th><th>Min °C</th><th>Max °C</th><th></th></tr>${cfg}</table></div><div class="mu">Esempi: frigo 0 … 4 °C, congelatore −22 … −18 °C.</div></details>`:''}
${fr.length?`<div class="row"><b>Storico</b><select onchange="tfr=this.value;R()"><option value="">Tutti i frigoriferi</option>${fr.map(f=>`<option value="${f.id}" ${tfr===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="card sc"><table><tr><th>Data</th><th>Frigo</th><th>Temperatura</th><th>Esito</th><th>Foto</th><th>Operatore</th></tr>${hr||'<tr><td class="mu">Nessuna temperatura registrata.</td></tr>'}</table></div>`:''}`}
function signBox(o,L,sel){const el=o.querySelector(sel);const f=()=>{const i=+L.op;let h='';if(L.sign&&L.sign.op===i)h='<div class="mu">✔ Firmato da <b>'+esc(opN(i))+'</b> · '+dt(L.sign.at)+'</div>'+sImg(L.sign.sig);else if(S.opPin[i])h='<button class="b" id="sgb">✍️ Firma ('+esc(opN(i))+')</button>';else h='<button class="b" id="sgb">✍️ Imposta firma e PIN di '+esc(opN(i))+'</button>';el.innerHTML=h;fotoHydrate();const b=el.querySelector('#sgb');if(b)b.onclick=()=>{if(S.opPin[i])pinDlg(i,()=>{L.sign={op:i,sig:S.opSig[i],at:new Date().toISOString()};f()});else opSetup(i,f)}};f();return f}

o.firstChild.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{S.sanAreas.splice(+b.dataset.d,1);draw();if(cb)cb()});
o.firstChild.querySelector('#aa').onclick=()=>askText('Nome area o attività (es. Friggitrice)',n=>{S.sanAreas.push(cap(n));draw();if(cb)cb()});
o.firstChild.querySelector('#ax').onclick=()=>{o.remove();R()}};draw()}
function sanDlg(){const L={op:0};const aOpts=()=>S.sanAreas.map(a=>'<option>'+esc(a)+'</option>').join('');
const o=dlg('<b>Nuova sanificazione</b><div class="row" style="margin-top:8px"><label>Data <input type="date" id="sd" value="'+td()+'"></label></div><div class="row"><label>Area / attività <select id="sa">'+aOpts()+'</select></label><button class="b" id="sg2">Gestisci aree</button></div><label style="display:block;margin-bottom:8px">Prodotto usato <input id="sp" style="width:100%;box-sizing:border-box" placeholder="es. sanificante alimentare"></label><label style="display:block;margin-bottom:8px">Note <input id="sn" style="width:100%;box-sizing:border-box"></label><div class="row"><label>Operatore '+opSel('so',0)+'</label><button class="b" id="sr">Rinomina operatori</button></div><div id="ssg" style="margin-bottom:8px"></div><div class="row"><button class="b" id="ssv">Salva</button><button class="b" id="sx">Annulla</button></div><div class="mu" id="sm"></div>');

so.onchange=()=>{L.op=+so.value;if(L.sign&&L.sign.op!==L.op)delete L.sign;f()};
o.querySelector('#sr').onclick=()=>opDlg(()=>{const c=+so.value;so.outerHTML=opSel('so',c);const n=o.querySelector('#so');n.onchange=()=>{L.op=+n.value;if(L.sign&&L.sign.op!==L.op)delete L.sign;f()};L.op=c;f()});
o.querySelector('#sg2').onclick=()=>areasDlg(()=>{o.querySelector('#sa').innerHTML=aOpts()});
o.querySelector('#sx').onclick=()=>o.remove();
o.querySelector('#ssv').onclick=()=>{const day=o.querySelector('#sd').value,area=o.querySelector('#sa').value;if(!day)return msg('Scegli la data.');if(!area)return msg('Scegli l\'area (o aggiungila con «Gestisci aree»).');
L.op=+o.querySelector('#so').value;if(!L.sign||L.sign.op!==L.op)return msg('Serve la firma con PIN dell\'operatore.');

return`<div class="card"><b>Tracciabilità</b><div class="mu">Tutti i lotti, ordinati per scadenza. Per aggiungerne uno apri il piatto (o la voce in Secondi piatti → Sughi e salse) e premi «+ Aggiungi lotto».</div></div>

return`<div class="card"><b>Fatture di acquisto</b><div class="row" style="margin-top:8px"><button class="b" onclick="view='fatt';R()">📄 Carica e consulta le fatture</button><span class="mu">${S.fatt.length} salvate</span></div></div>

body=`<div class="row"><label>Peso panetto (g) <input type="number" min="1" value="${m.peso}" onchange="IM(curImp).peso=+this.value;R()"></label></div><div class="mu">Peso totale ${g.toLocaleString('it-IT')} g · ${np.toFixed(1)} panetti · costo preparazione ${eur(impC(m)*np)} · <b>costo per panetto ${eur(impC(m))}</b></div>

const CH=[['glovo','Glovo'],['justeat','Just Eat'],['deliveroo','Deliveroo'],['ecom','E-commerce'],['fork','The Fork'],['extra','Altra piattaforma'],['tel','Telefono'],['asporto','Asporto'],['tavoli','Tavoli']],COM=['glovo','justeat','deliveroo','ecom','fork','extra'];

const plab=(k,m)=>{const f=x=>new Date(x+'T12:00:00'),o={day:'2-digit',month:'2-digit'};if(m==='mesi')return f(k+'-01').toLocaleDateString('it-IT',{month:'long',year:'numeric'});if(m==='settimane'){const a=f(k),b=new Date(a);b.setDate(b.getDate()+6);return a.toLocaleDateString('it-IT',o)+' – '+b.toLocaleDateString('it-IT',o)+' '+b.getFullYear()}return f(k).toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})};
const vTot=k=>Object.values(S.vend[k]||{}).reduce((a,b)=>a+(+b||0),0);
function aggr(m){const A={};Array.from(new Set(Object.keys(S.rev).concat(Object.keys(S.vend)))).forEach(k=>{const v=S.rev[k]||{},p=pk(k,m);A[p]=A[p]||{};CH.forEach(([c])=>A[p][c]=(A[p][c]||0)+(+v[c]||0));A[p]._cm=(A[p]._cm||0)+dCm(k);A[p]._pz=(A[p]._pz||0)+vTot(k)});
return Object.keys(A).sort().reverse().map(k=>{const v=A[k],g=CH.reduce((s,[c])=>s+(v[c]||0),0),cm=v._cm||0;return{k,v,g,cm,n:g-cm,pz:v._pz||0}})}
const dEff=(k,c)=>{const o=((S.rev[k]||{})._o||{})[c]||{};if(o.off)return 0;const b=o.pct!==undefined?+o.pct:(+S.p[c]||0)+(+S.p[c+'F']||0);const iva=o.iva!==undefined?o.iva:S.p[c+'V'];return iva?b*1.22:b};

if(Object.keys(o).length){if(Object.keys(ov).length)o._o=ov;S.rev[rd]=o}else delete S.rev[rd];R()}

<div class="row"><button class="b" onclick="saveRev()">Salva giornata</button><span class="mu">Già salvato per questa data: ${eur(cs)} · commissioni ${eur(dCm(rd))}</span></div></div>${vendCard()}${sum}

function impMerge(m){const names={};S.ing.forEach(i=>{names[i.name.trim().toLowerCase()]=i.id});const idm={};let ni=0,nd=0;
(m.ing||[]).forEach(i=>{if(i.auto)return;const k=String(i.name||'').trim().toLowerCase();if(names[k]){idm[i.id]=names[k];return}let id=i.id;if(!id||S.ing.some(x=>x.id===id))id='i'+Date.now()+'_'+ni;const c=Object.assign({},i,{id});S.ing.push(c);names[k]=id;idm[i.id]=id;ni++});
const dm={};let sk=0;(m.dishes||[]).forEach(d=>{const dn=String(d.name||'').trim().toLowerCase();if(S.dishes.some(x=>String(x.name||'').trim().toLowerCase()===dn&&(x.cat||'pizze')===(d.cat||'pizze'))){sk++;return}let id=d.id;if(!id||S.dishes.some(x=>x.id===id))id='d'+Date.now()+'_'+nd;dm[d.id]=id;nd++;S.dishes.push(Object.assign({},d,{id,lines:(d.lines||[]).map(l=>({ing:idm[l.ing]||l.ing,qty:l.qty}))}))});

function parseOcr(txt){

m=full.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/);if(m){let y=m[3];if(y.length===2)y='20'+y;data=y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
for(const l0 of L.filter((x,i)=>i<20&&/s\.?\s?r\.?\s?l\b|s\.?\s?p\.?\s?a\b|supermercat|\bsnc\b|s\.a\.s/i.test(x)).concat(L.slice(0,8))){const l=l0.replace(/\b(fattura|documento|data|numero)\b.*$/i,'').trim();if((l.match(/[A-Za-zÀ-ÿ]/g)||[]).length>=4&&!/fattura|documento|cliente|spett|destinat|data\b|pag\.|p\.?\s?iva|partita|codice|via |cap\b|tel\b|www|@|descrizione|importo|quantit/i.test(l)){forn=l;break}}

<div class="sc" style="margin-top:8px"><table><tr><th>Descrizione</th><th>Qtà</th><th>Un.</th><th>Prezzo unit.</th><th>Totale</th><th>IVA</th><th>Ingrediente</th></tr>${f.righe.map((r,j)=>`<tr><td>${esc(r.d)}</td><td>${r.q}</td><td>${esc(r.u)}</td><td>${eur(r.pu)}</td><td>${eur(r.tot)}</td><td>${r.iva}%</td><td>${mCell(f,r,j)}</td></tr>`).join('')}</table></div>
<div class="row" style="margin-top:8px"><span class="mu">${f.piva?'P.IVA '+esc(f.piva)+' · ':''}${f.file?'file: '+esc(f.file):''}</span>${f.nuova?`<button class="b" onclick="S.fatt.find(x=>x.id==='${f.id}').nuova=false;R()">Segna come controllata</button>`:''}<button class="b" onclick="ask('Eliminare questa fattura?',()=>{S.fatt=S.fatt.filter(x=>x.id!=='${f.id}');R()})">Elimina</button></div></details>`).join('');
return`<div class="row"><button class="b" onclick="view='par';R()">← Parametri</button></div>
<div class="card"><b>Carica fatture di acquisto</b><div class="mu" style="margin:4px 0 8px">Fatture elettroniche in formato <b>XML</b>, <b>.p7m</b> o <b>ZIP</b> con più fatture (lettura precisa), oppure <b>foto</b> della fattura: il programma la trasforma in testo e compila i dati (controlla sempre fornitore, righe e prezzi prima di salvare). I PDF non sono supportati: usa l'XML o una foto.</div><input type="file" accept=".xml,.p7m,.zip,image/*" multiple onchange="loadFatt(this.files)"><div class="mu" id="fmsg" style="margin-top:6px">${esc(fmsg)}</div></div>
${pend.length>1?`<div class="row"><button class="b" onclick="saveAll()">Salva tutte (${pend.length})</button><span class="mu">Salva tutte le fatture lette; quelle già presenti vengono saltate.</span></div>`:''}${pe}<details class="card"><summary><b>🏛 Scarica le fatture dal cassetto fiscale (Agenzia delle Entrate)</b></summary><div style="margin-top:8px">
<p class="mu">Il programma non può collegarsi da solo al cassetto fiscale: l'accesso è personale (SPID, CIE o CNS) e le credenziali non vengono mai chieste qui. Puoi però scaricare le fatture ricevute dal portale e caricarle tutte insieme.</p>
<ol style="margin:6px 0;padding-left:20px">
<li style="margin:4px 0">Apri il sito <a href="https://www.agenziaentrate.gov.it" target="_blank" rel="noopener" style="color:var(--ac)">agenziaentrate.gov.it</a> ed entra nell'area riservata con SPID, CIE o CNS (oppure con le credenziali Fisconline/Entratel).</li>
<li style="margin:4px 0">Vai su <b>Fatture e Corrispettivi</b> (Servizi → Fatturazione) e premi <b>Accedi</b>. Se accedi per conto dell'attività, scegli il ruolo giusto (per te stesso o come soggetto delegante).</li>
<li style="margin:4px 0">La prima volta devi <b>aderire al servizio di consultazione</b>: senza adesione i file XML delle fatture ricevute non si possono consultare né scaricare.</li>
<li style="margin:4px 0">Apri <b>Consultazione</b> → <b>Fatture elettroniche e altri dati IVA</b> → <b>Fatture ricevute</b> e scegli il periodo.</li>
<li style="margin:4px 0">Seleziona le fatture e scarica i file XML (se il portale lo propone, anche tutti insieme in un unico ZIP).</li>
<li style="margin:4px 0">Torna qui, premi il campo di caricamento e scegli i file scaricati (XML, .p7m o ZIP). Controlla e premi <b>Salva tutte</b>, oppure salva una per una.</li>
</ol>
<p class="mu">I nomi dei menu possono cambiare nel tempo. In alternativa chiedi al commercialista di inviarti i file XML delle fatture ricevute (li può scaricare lui con la delega), oppure esportali dal tuo programma di fatturazione. Se carichi due volte la stessa fattura, il programma ti avvisa.</p>
</div></details>
${autoCard()}
<div class="row"><input id="fs" placeholder="Cerca fornitore, numero o prodotto…" value="${esc(fq)}" oninput="fq=this.value.toLowerCase();R();document.getElementById('fs').focus()"><span class="mu">${list.length} fatture · imponibile ${eur(tot)}</span></div>${saved||'<div class="mu">Nessuna fattura salvata.</div>'}`}
function pGuida(){
const go=(v,t)=>`<button class="b" onclick="view='${v}';R();window.scrollTo(0,0)">Vai a ${t}</button>`;
const sec=(open,t,body)=>`<details class="card" ${open?'open':''}><summary><b>${t}</b></summary><div style="margin-top:8px">${body}</div></details>`;
const ol=a=>`<ol style="margin:6px 0;padding-left:20px">${a.map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ol>`;
const sync=(typeof syOn==='function'&&syOn())?"<p>Accedi con l'email e la password che ti ha creato il supervisore. I dati sono salvati nel tuo account e si aggiornano da soli su tutti i dispositivi in cui accedi. Premi <b>Esci</b> in alto per uscire: i dati restano nel tuo account e vengono tolti da questo dispositivo.</p><p>Se dimentichi la password, nella schermata di accesso premi <b>Password dimenticata?</b> e scrivi la tua email: ti arriva un link per sceglierne una nuova. Se l\'email non arriva, chiedi al supervisore di reimpostarla.</p>":'<p>I dati si salvano automaticamente nel browser di questo dispositivo. Su un altro dispositivo (telefono, iPad, computer) partirai da dati separati. Se cancelli i dati del browser, li perdi.</p>';
return`<div class="card"><b>Istruzioni per l'uso</b><p class="mu" style="margin:6px 0 0">Ordine consigliato: <b>1 Parametri</b> → <b>2 Ingredienti</b> → <b>3 Impasto e Formati pasta</b> → <b>4 Piatti</b> → <b>5 Fatturato</b>. Ogni modifica si salva da sola: dopo aver scritto un numero premi Invio o tocca fuori dal campo, così si aggiorna il calcolo. Apri ogni sezione qui sotto per i passaggi.</p></div>`
+sec(true,'1. Parametri: costi e ricarichi',`<p>${go('par','Parametri')}</p>`+ol(['<b>Costi mensili dell\'attività</b>: scrivi gli importi di luce, dipendenti, gas, affitto, acqua, spazzatura e altro. Per ogni voce scegli <b>mensile</b> o <b>annuale</b>: se annuale, il programma divide per 12.','<b>Altri costi mensili</b>: telefono, e-commerce, commercialista, HACCP, consulente del lavoro, software fatturazione, pubblicità (ads, volantini, altro). Per ogni voce puoi scegliere l\'IVA (nessuna, 4%, 10%, 22%) che viene sommata all\'importo. Anche qui puoi scegliere importo <b>mensile</b> o <b>annuale</b> (se annuale viene diviso per 12).','<b>Ore e lavoro</b>: giorni lavorativi al mese; poi scegli se le ore che inserisci sono <i>giornaliere</i>, <i>settimanali</i> o <i>mensili</i> e scrivi ore e minuti (es. 38 ore e 30 minuti a settimana): il programma ricava sempre le ore giornaliere. Infine la <b>media minuti di lavoro pietanza</b>. Il costo del lavoro per ogni pietanza si calcola da solo.','<b>Commissioni piattaforme</b>: per Glovo, Just Eat, Deliveroo, E-commerce personale, The Fork e una piattaforma libera (scrivi tu il nome) inserisci la commissione %, l\'eventuale percentuale fissa aggiuntiva e, se serve, spunta <b>+ IVA 22%</b>.','<b>IVA, scarto e ricarico</b>: l\'interruttore per calcolare i costi con l\'IVA di acquisto, lo scarto % (perdite e sprechi) e il ricarico (moltiplicatore per il prezzo consigliato, ad esempio 2,5).']))
+sec(false,'2. Ingredienti: prezzi di acquisto',`<p>${go('ing','Ingredienti')}</p>`+ol(['Per ogni ingrediente scegli l\'unità: <b>€/kg</b> (scrivi il prezzo al kg), <b>€/pz</b> (prezzo del singolo pezzo) oppure <b>€/confezione</b>.','Con <b>€/confezione</b> scrivi il prezzo della confezione e il <b>peso in grammi</b> (ad esempio 375): il programma calcola da solo il prezzo al kg e il costo al grammo.','Scegli l\'<b>IVA di acquisto</b> (4%, 10% o 22%): il costo al grammo mostrato la include.','Con <b>+ Nuovo ingrediente</b> aggiungi un nome; per rinominarlo modifica il testo; con ✕ lo elimini. Il nome inizia sempre con la maiuscola.','I <b>Sottoprodotti</b> (i sughi creati in Piatti → Sugo, ad esempio «Sugo di canocchie») compaiono in elenco con l\'etichetta gialla: il prezzo è calcolato dalla ricetta e il pulsante <b>Apri sugo</b> porta alla ricetta.','<b>Scarto</b>: accanto a ogni ingrediente scrivi i grammi di scarto e su quanti grammi lordi (ad esempio 200 g su 1000 g = 20%). Il programma calcola la percentuale e <b>maggiora il prezzo di quella percentuale</b>, poi aggiunge l\'IVA (es. 3,00 €/kg con scarto 10% e IVA 10% = 3,00 × 1,10 × 1,10 = 3,63 €/kg). Il costo al grammo aumenta in tutti i piatti. Per le confezioni, se lasci vuoto, il riferimento è il peso della confezione; per gli ingredienti a pezzi non c\'è scarto. Se usi anche lo scarto generale in Parametri, i due effetti si sommano.','Spunta <b>Solo senza prezzo</b> per trovare gli ingredienti da completare: finché hanno l\'avviso giallo "manca prezzo" costano 0 nei piatti.']))
+sec(false,'3. Impasto',`<p>${go('imp','Impasto')}</p>`+ol(['In alto ci sono i pulsanti degli impasti. Scegli quello da compilare, oppure aggiungine con <b>+ Impasto in casa</b> o <b>+ Impasto comprato</b>.','<b>Impasto in casa</b>: per farina e olio scegli il tipo dai menu (fino a 4 righe ciascuno); per acqua, sale, lievito, latte e uova scrivi i grammi. Inserisci i <b>grammi totali</b> dell\'intera preparazione (ad esempio 1000 g di farina) e il <b>prezzo al kg</b>. Imposta il <b>peso del panetto</b>: vedi il costo per panetto.','<b>Impasto comprato</b> (senza glutine, pinsa, pane da hamburger, pane da hot dog, pane kebab): scrivi il peso del panetto, scegli come inserire il prezzo (<b>al panetto</b>, <b>al kg</b> o <b>al cartone</b> con il numero di panetti) e l\'IVA.','<b>Pasta asciutta</b> e <b>Pasta fresca</b>: scegli il formato dal menu e scrivi i <b>grammi per porzione</b>. I formati si creano nella scheda <b>Formati pasta</b>.']))
+sec(false,'4. Formati pasta',`<p>${go('fmt','Formati pasta')}</p>`+ol(['Premi <b>+ Formato pasta asciutta</b> o <b>+ Formato pasta fresca</b> e scrivi il nome (ad esempio Spaghetti).','Nella tabella scrivi il <b>prezzo al kg</b> e scegli l\'<b>IVA</b>: vedi il costo al grammo.','Il formato compare nel menu dell\'impasto Pasta asciutta o Pasta fresca, secondo il tipo scelto.']))
+sec(false,'5. Piatti',`<p>${go('piatti','Piatti')}</p>`+ol(['In alto scegli la <b>categoria</b>: Antipasti, Primi piatti, Sugo, Secondi piatti, Contorni, Pizze, Panini, Fritti, Altri piatti. Con il menu <b>Categoria</b> dentro al piatto lo sposti in un\'altra.','Premi <b>+ Nuovo piatto</b> e scrivi il nome: il piatto si crea nella categoria aperta e si apre da solo.','Nell\'elenco <b>spunta gli ingredienti</b> del piatto e, accanto a ognuno, scrivi i <b>grammi</b> (o i pezzi). Usa "Filtra ingredienti" per trovarli.','Scegli l\'<b>Impasto</b> dal menu (con il costo per panetto), oppure <i>Nessun impasto</i>, e scrivi il <b>prezzo di vendita</b>. Nei <b>Primi piatti</b> al posto dell\'impasto scegli il <b>Tipo di pasta</b> (dai Formati pasta) e i grammi: il costo della pasta entra nel costo del piatto.','Nella riga del piatto vedi <b>margine</b> e <b>prezzo di vendita</b>. Aprendolo trovi anche costo ingredienti, costo dell\'impasto, costo totale (con lavoro e scarto), <b>prezzo consigliato</b> (costo totale × ricarico) e <b>numero di pareggio</b>.','Gli avvisi gialli "senza prezzo" o "senza grammi" indicano dati mancanti: il costo del piatto è sottostimato finché non li completi.','<b>Sugo</b>: spunta gli ingredienti e scrivi i grammi; vedi peso totale, costo al kg e, scrivendo i grammi della <b>Porzione</b>, quante porzioni ottieni e il costo per porzione. Ogni sugo compare anche in <b>Ingredienti</b> come <b>Sottoprodotto</b>, con il prezzo al kg calcolato: negli altri piatti lo spunti come un ingrediente e scrivi i grammi. Non si modifica da lì: cambia la ricetta del sugo e i costi si aggiornano da soli.','<b>Secondi piatti</b>: sotto i piatti trovi le sottocategorie, per esempio <b>Sughi e salse</b>. Con <b>+ Aggiungi</b> inserisci una voce (ragù, besciamella…) con i suoi lotti di tracciabilità; con <b>+ Nuova sottocategoria</b> ne crei altre.','Se cambi un prezzo in Ingredienti o in Impasto, tutti i piatti che lo usano si ricalcolano da soli.']))
+sec(false,'6. Fatturato',`<p>${go('rev','Fatturato')}</p>`+ol(['Scegli la <b>data</b> e scrivi gli incassi di quel giorno nelle caselle: Glovo, Just Eat, Deliveroo, E-commerce, The Fork, la piattaforma libera (scrivi il nome), Telefono, Asporto, Tavoli. Lascia vuote quelle senza incassi. Premi <b>Salva giornata</b>.','Per le piattaforme puoi, solo per quella giornata, spuntare <b>senza commissione</b>, scrivere una <b>commissione %</b> diversa o attivare l\'<b>IVA 22%</b>.','Con i bottoni <b>Giorni, Settimane, Mesi</b> vedi i totali, le commissioni e il netto. Nei mesi trovi anche <b>Dopo costi fissi</b>, che toglie i costi mensili di Parametri.','Per correggere una giornata premi ✎ nell\'elenco dei giorni (o scegli di nuovo la data), cambia gli importi e salva di nuovo.','<b>Piatti venduti del giorno</b>: sotto gli incassi apri la scheda e scrivi <b>quanti piatti hai venduto</b> per ogni piatto (divisi per categoria, con ricerca). Si salva subito, senza premere Salva giornata. Nell\'elenco compare la colonna <b>Piatti</b> e in <b>Grafici</b> vedi i piatti più venduti e il totale per categoria.']))
+sec(false,'7. Fatture di acquisto',`<p>${go('fatt','Fatture di acquisto')}</p>`+ol(['Si apre anche da <b>Parametri → Carica e consulta le fatture</b>.','Premi il campo di caricamento e scegli uno o più file: fatture elettroniche <b>XML</b>, <b>.p7m</b> o un <b>ZIP</b> con più fatture (lettura precisa), oppure una <b>foto</b> della fattura: viene trasformata in testo e i dati compaiono già compilati (lettura gratuita nel browser, senza inviare la foto a nessuno). Controlla sempre fornitore, righe e prezzi. I PDF non sono supportati.','Per scaricare le fatture dal cassetto fiscale dell\'Agenzia delle Entrate apri in questa pagina la sezione <b>Scarica le fatture dal cassetto fiscale</b>: ci sono i passaggi.','Per far arrivare le fatture da sole dal tuo servizio di fatturazione (solo con la sincronizzazione online) apri la sezione <b>Collega un servizio di fatturazione</b>: ci sono i passaggi. Le fatture in arrivo compaiono con l\'etichetta <b>nuova</b>.','Compare la scheda <b>Da verificare e salvare</b>: controlla fornitore, numero, data e tutte le righe con quantità e prezzi, correggi ciò che serve, poi premi <b>Salva fattura</b>.','Le fatture salvate si cercano per fornitore, numero o prodotto, si aprono per vedere le righe e si possono eliminare.']))
+sec(false,'8. Salvataggio e altri dispositivi',sync)
+sec(false,'9. HACCP: tracciabilità, temperature, sanificazione',ol(['Il pulsante <b>HACCP</b> raccoglie tre sezioni: <b>Tracciabilità</b>, <b>Temperature frigo</b> e <b>Sanificazione</b>. Scegli la sezione con i pulsanti in cima.','<b>Tracciabilità</b>: dentro ogni piatto, sugo o voce di Sughi e salse premi <b>+ Aggiungi lotto</b>. Scegli data di produzione e di scadenza dal calendario, l\'operatore, le note e carica o scatta la <b>foto dell\'etichetta</b>; poi l\'operatore può firmare. In <b>HACCP → Tracciabilità</b> vedi tutti i lotti ordinati per scadenza: in rosso gli scaduti, in giallo quelli che scadono entro 2 giorni.','<b>Temperature frigo</b>: premi <b>+ Aggiungi frigo</b> (fino a 20) e scrivi il nome. In <b>Nomi e limiti dei frigoriferi</b> imposta minimo e massimo (ad esempio 0…4 °C; per un congelatore −22…−18 °C). Scegli il <b>giorno</b>, scrivi la temperatura di ogni frigo e premi <b>📷 Foto</b> per la foto del display. Fuori dai limiti compare «fuori limite» in rosso. Sotto c\'è lo storico, filtrabile per frigo; puoi indicare anche l\'operatore del giorno.','<b>Sanificazione</b>: premi <b>+ Nuova sanificazione</b>, scegli data, area o attività (con <b>Gestisci aree</b> le modifichi o ne aggiungi), prodotto usato, note e operatore. L\'operatore preme <b>Firma</b>, scrive il PIN e la sua firma compare con data e ora: senza firma la registrazione non si salva.']))
+sec(false,'10. Operatori: firma e PIN',ol(['Gli operatori sono 10. Con <b>Nomi operatori</b> (in Tracciabilità, Sanificazione o dentro un lotto) scrivi il nome accanto a ogni numero.','Col pulsante <b>Firma</b> accanto al nome, ogni operatore sceglie un <b>PIN di 4 cifre</b> e disegna la <b>firma col dito</b>, una volta sola.','Per firmare un lotto o una sanificazione l\'operatore scrive solo il PIN: la sua firma compare con data e ora. Se cambi operatore o date di un lotto già firmato, va rifirmato; i lotti senza firma sono segnati «non firmato».','Per cambiare firma o PIN serve il PIN attuale; se l\'hai dimenticato usa <b>PIN dimenticato? Reimposta</b> (le firme già messe restano).','La firma identifica l\'operatore ma non è una firma legale autografa.']))
+sec(false,'11. Consigli e attenzione',ol(['Parti dagli ingredienti più usati: completa prima i loro prezzi.','Aggiorna i prezzi quando cambiano i fornitori: i costi dei piatti si aggiornano da soli.','Controlla ogni tanto gli avvisi gialli (prezzo, grammi, peso della confezione).','Il pulsante <b>Ripristina dati iniziali</b> in Parametri cancella tutti i dati inseriti: usalo solo se vuoi ricominciare da capo.']))
+sec(false,'12. Costi e grafici',ol(['<b>Costi</b> (accanto a Fatturato): scrivi le <b>spese del giorno divise per fornitore</b> con data, fornitore, importo con IVA e IVA. Il fornitore si può scegliere tra quelli già usati. Per ogni mese vedi il totale e il totale per fornitore (grafico a cerchio).','<b>Carica una fattura</b> direttamente in Costi: scegli l\'XML o la foto, il programma riconosce <b>fornitore e voci</b> e le divide per <b>IVA 4%, 10%, 22%</b>. Controlla e premi <b>Salva fattura</b>. Più sotto trovi la tabella <b>IVA sui costi</b> del mese (imponibile, IVA e totale per aliquota).','Le <b>fatture caricate</b> compaiono nei costi da sole, con la data e il totale della fattura (🧾): non riscriverle. Se una fattura non va contata premi <b>Escludi</b> (poi <b>Includi</b>). Le spese manuali si modificano con ✎ e si tolgono con ✕. La spunta «Importi con IVA» mostra i costi con o senza IVA.','<b>Grafici</b>: mette insieme fatturato, costi fornitori e costi fissi di Parametri. I grafici per canale, fornitore, aliquota IVA e voce fissa sono <b>a cerchio</b>; gli ultimi 12 mesi e il giorno per giorno sono a barre. Vedi gli ultimi 12 mesi con il risultato di ogni mese (fatturato − commissioni − costi fornitori − costi fissi) e, scegliendo un mese, il giorno per giorno, il fatturato per canale e i costi per fornitore e per voce fissa.']))
+sec(false,'13. Copia e importa i dati',ol(['In <b>Parametri → Copia e importa i dati</b> premi <b>Esporta modello</b>: salva un file con piatti, ingredienti, impasti, formati e parametri tecnici (non fatture, HACCP, fatturato e costi mensili). È il file da dare a un altro ristorante.','Nell\'altro account vai nello stesso punto e scegli <b>Importa da file</b>. <b>Aggiungi</b> tiene ciò che c\'è già e aggiunge solo ciò che manca (senza duplicare ingredienti e piatti con lo stesso nome); <b>Sostituisci</b> cancella piatti, ingredienti, impasti e formati attuali e mette quelli del file.','<b>Esporta backup completo</b> salva tutto (anche fatture, HACCP, fatturato): con <b>Importa da file</b> sostituisce tutti i dati dell\'account. Le foto e le firme non sono incluse.']))

fare: creare account, disattivare/riattivare, cambiare password, eliminare, vedere solo i ristoranti che ha creato lui. Un minus non può mai toccare te né altri minus.']:['Le operazioni che non vedi (pulsanti assenti) non ti sono state concesse dal supervisore.']))):'')}

function addM(d,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');const t=m?new Date(+m[1],+m[2]-1,+m[3]):new Date();const day=t.getDate();t.setDate(1);t.setMonth(t.getMonth()+n);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
