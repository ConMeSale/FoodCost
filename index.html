<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Food Cost</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--fg:#1f1d1a;--mu:#6e6a63;--card:#fff;--bd:#e3ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#fef3c7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--fg:#f0ece6;--mu:#9d978d;--card:#211f1c;--bd:#37332e;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#3a3012}}
:root[data-theme="dark"]{--bg:#171513;--fg:#f0ece6;--mu:#9d978d;--card:#211f1c;--bd:#37332e;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#3a3012}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 10px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
details>summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.w{background:var(--warn);padding:1px 6px;border-radius:5px;font-size:12px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:16px;cursor:pointer;font:inherit}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sg{height:34px;max-width:120px;background:#fff;border:1px solid var(--bd);border-radius:4px;cursor:pointer;object-fit:contain;vertical-align:middle}
.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);cursor:pointer;margin-right:4px;background:var(--bg);vertical-align:middle}
label{display:flex;gap:6px;align-items:center}
@media(max-width:600px){main{padding:8px}h1{font-size:18px}nav button,.b{padding:8px 10px}input,select{font-size:16px}td,th{padding:4px}.card{padding:8px}input[type=number]{width:80px}details>summary{gap:4px}}
</style></head><body><main>
<h1>🍕 Food Cost</h1>
<div class="row"><button class="b" id="sbtn" onclick="logout()">Esci</button><span class="mu" id="sst"></span></div>
<nav id="nav"></nav><div id="v"></div></main>
<script>
const D={"ing": [], "dishes": [], "p": {"useIva": true, "iva": 10, "scarto": 10, "ricarico": 2.5}};let dq='',S=null,view=(()=>{try{return sessionStorage.getItem('fcs_view')||'piatti'}catch(e){return'piatti'}})(),open_=null,q='',onlyMiss=false;
try{S=JSON.parse(localStorage.getItem('fcs1'))}catch(e){}
if(!S||!S.ing)S=JSON.parse(JSON.stringify(D));
const CATS=[['farina','Farina',4],['acqua','Acqua',1],['olio','Olio',4],['sale','Sale',1],['lievito','Lievito',1],['latte','Latte',1],['uova','Uova',1]];
S.p=Object.assign({luce:0,dip:0,gas:0,affitto:0,minuti:6,giorni:26,ore:10,acqua:0,spazz:0,altro:0,glovo:0,justeat:0,deliveroo:0,ecom:0,fork:0,extra:0,forkF:0,extraF:0,extraName:'',glovoF:0,justeatF:0,deliverooF:0,ecomF:0,ctel:0,cecom:0,ccomm:0,chaccp:0,ccons:0,cfatt:0,cads:0},S.p);if(!S.rev)S.rev={};
const totC=()=>['luce','dip','gas','affitto','acqua','spazz','altro','ctel','cecom','ccomm','chaccp','ccons','cfatt','cads'].reduce((s,k)=>s+(+S.p[k]||0)*(S.p[k+'A']?1/12:1)*(1+(+S.p[k+'I']||0)/100),0),eff=c=>{const x=(+S.p[c]||0)+(+S.p[c+'F']||0);return S.p[c+'V']?x*1.22:x},oreM=()=>S.p.giorni*S.p.ore,cOr=()=>oreM()?totC()/oreM():0,lav=()=>cOr()/60*S.p.minuti;
if(!S.imp)S.imp={peso:220,lines:[]};
if(!S.imp.slots){const A={farina:['Farina',null,0],acqua:['Acqua',null,0],olio:['Olio',null,0],sale:['Sale',null,0],lievito:['Lievito',null,0],latte:['Latte',null,0],uova:['Uova',null,0]};
S.imp.slots={};CATS.forEach(([c,,n])=>{const[nm,p,q]=A[c];let i=S.ing.find(x=>x.name.trim().toLowerCase()===nm.toLowerCase());if(!i){i={id:'i'+nm.toLowerCase(),name:nm,price:p,unit:'kg'};S.ing.push(i)}else if(!i.price&&p)i.price=p;
const old=(S.imp.lines||[]).find(l=>l.ing===i.id);S.imp.slots[c]=Array.from({length:n},(_,k)=>k?{ing:'',qty:0}:{ing:i.id,qty:old?old.qty:q})});delete S.imp.lines}
if(!S.imps)S.imps=[Object.assign({id:'m0',name:'Impasto classico',type:'ricetta',mode:'pz',price:null,box:1},S.imp)];
if(!S.impSeed){['Senza glutine','Pinsa'].forEach((n,k)=>{if(!S.imps.some(m=>m.name.toLowerCase()===n.toLowerCase())){const m={id:'ms'+k,name:n,type:'comprato',peso:220,mode:'pz',price:null,box:1,slots:{}};CATS.forEach(([c])=>m.slots[c]=S.imps[0].slots[c].map(s=>({ing:s.ing,qty:0})));S.imps.push(m)}});S.impSeed=1}
if(!S.impSeed2){[['Pane da hamburger',null],['Pane da hot dog',null],['Pane kebab',null]].forEach(([n,p],k)=>{if(!S.imps.some(m=>m.name.toLowerCase()===n.toLowerCase())){const m={id:'mp'+k,name:n,type:'comprato',peso:0,mode:'pz',price:p,box:1,slots:{}};CATS.forEach(([c])=>m.slots[c]=S.imps[0].slots[c].map(s=>({ing:s.ing,qty:0})));S.imps.push(m)}});S.impSeed2=1}
if(!S.fmt)S.fmt=[];if(!S.fatt)S.fatt=[];
S.dishes.forEach(d=>{if(!d.cat)d.cat='pizze'});if(!S.subs)S.subs=[{id:'s0',name:'Sughi e salse'}];if(!S.preps)S.preps=[];if(!S.lots)S.lots=[];if(!S.ops)S.ops=Array(10).fill('');if(!S.frigos)S.frigos=[];if(!S.temps)S.temps={};if(!S.tfoto)S.tfoto={};if(!S.top)S.top={};if(!S.san)S.san=[];if(!S.sanAreas)S.sanAreas=['Piani di lavoro','Attrezzature e utensili','Frigoriferi e celle','Forno e cappa','Pavimenti','Servizi igienici'];if(!S.opPin)S.opPin=Array(10).fill('');if(!S.opSig)S.opSig=Array(10).fill('');
if(!S.impSeed3){[['Pasta asciutta','secca','mpa'],['Pasta fresca','fresca','mpf']].forEach(([n,k,id])=>{if(!S.imps.some(m=>m.id===id))S.imps.push({id,name:n,type:'pasta',kind:k,fmt:'',g:0,slots:{}})});S.impSeed3=1}
const cap=s=>{s=String(s).replace(/ +/g,' ').trim();return s.charAt(0).toUpperCase()+s.slice(1)};
{const AL={'friarelli':'friarielli','cipolla':'cipolle','pomodorini freschi':'pomodori freschi','spek':'speck','straciatella':'stracciatella 149g','scamorza aff.':'scamorza affumicata 140g'},seen={},map={},keep=[];
S.ing.forEach(i=>i.name=cap(i.name));
S.ing.slice().sort((a,b)=>(AL[a.name.toLowerCase()]?1:0)-(AL[b.name.toLowerCase()]?1:0)).forEach(i=>{const n=i.name.toLowerCase(),k=AL[n]||n;if(seen[k]){map[i.id]=seen[k].id;if(!seen[k].price&&i.price)seen[k].price=i.price}else{seen[k]=i;keep.push(i)}});
S.ing=keep;const mp=id=>map[id]||id;S.dishes.forEach(d=>d.lines.forEach(l=>l.ing=mp(l.ing)));S.imps.forEach(m=>CATS.forEach(([c])=>(m.slots[c]||[]).forEach(s=>{if(s.ing)s.ing=mp(s.ing)})))}
let curImp=null;const IM=id=>S.imps.find(m=>m.id===id)||S.imps[0];
const impL=m=>CATS.flatMap(([c])=>m.slots[c]).filter(l=>l.ing);
const impC=m=>{if(m.type==='pasta'){const f=S.fmt.find(x=>x.id===m.fmt);if(!f||!f.price)return 0;let p=+f.price;if(S.p.useIva)p*=1+(+f.iva||10)/100;return p/1000*(+m.g||0)}
if(m.type==='comprato'){let p=(+m.price||0)*(S.p.useIva?1+(+m.iva||10)/100:1);return m.mode==='kg'?p*(m.peso/1000):m.mode==='box'?p/(m.box||1):p}
let c=0,g=0;impL(m).forEach(l=>{const i=S.ing.find(x=>x.id===l.ing);if(i)c+=uc(i)*(+l.qty||0);g+=+l.qty||0});const n=g/(+m.peso||1);return n>0?c/n:0};
const pastaC=(fid,g)=>{const f=S.fmt.find(x=>x.id===fid);if(!f||!f.price)return 0;let p=+f.price;if(S.p.useIva)p*=1+(+f.iva||10)/100;return p/1000*(+g||0)};
const dc=d=>d.cat==='primi'?pastaC(d.pf,d.pg):d.imp==='none'?0:impC(IM(d.imp));
const save=()=>{try{localStorage.setItem('fcs1',JSON.stringify(S))}catch(e){}syncChanged()};
const eur=n=>isFinite(n)?n.toLocaleString('it-IT',{style:'currency',currency:'EUR'}):'–';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ing=id=>S.ing.find(x=>x.id===id);
const ivaOpt=v=>[4,10,22].map(x=>`<option value="${x}" ${(+v||10)===x?'selected':''}>${x}%</option>`).join('');
const pkg=i=>i.price&&i.unit==='kg'?eur(+i.price):i.price&&i.unit==='conf'&&+i.conf?eur(i.price/(i.conf/1000)):'';
const fm=n=>n.toLocaleString('it-IT',{minimumFractionDigits:4,maximumFractionDigits:4});
const scP=i=>{if(i.unit==='pz')return 0;const sw=+i.sw||0,lg=+i.sg||(i.unit==='conf'&&+i.conf?+i.conf:1000);return lg>0&&sw>0?Math.min(sw/lg,.95)*100:0};
const sf=i=>{const r=scP(i)/100;return r>0?1/(1-r):1};
const uc=i=>{let p=+i.price||0;if(S.p.useIva)p*=1+(+i.iva||10)/100;return i.unit==='pz'?p:(i.unit==='conf'?(+i.conf?p/+i.conf:0):p/1000)*sf(i)};
function calc(d){let c=0,miss=0,nog=0;d.lines.forEach(l=>{const i=ing(l.ing);if(!i||!i.price)miss++;if(!+l.qty)nog++;if(i)c+=uc(i)*(+l.qty||0)});
const base=c+dc(d),tot=(base+lav())*(1+S.p.scarto/100);
return{par:totC()/(base+lav()),c,miss,nog,tot,rec:tot*S.p.ricarico,fc:d.sale?base/d.sale:NaN,mg:d.sale-tot}}
const used=id=>S.dishes.filter(d=>d.lines.some(l=>l.ing===id)).length;
function R(){if(view==='trac'){view='haccp';hsub='trac'}if(view==='admin'&&isAdm()&&Date.now()-admAt>20000){admAt=Date.now();admLoad()}save();CH.find(x=>x[0]==='extra')[1]=S.p.extraName||'Altra piattaforma';try{sessionStorage.setItem('fcs_view',view)}catch(e){}
document.getElementById('nav').innerHTML=(isAdm()?[['admin',isSup()?'👑 Supervisore':'🛡️ Gestione']]:[]).concat([['piatti','Piatti'],['haccp','HACCP'],['ing','Ingredienti'],['imp','Impasto'],['rev','Fatturato'],['fmt','Formati pasta'],['par','Parametri'],['guida','Istruzioni']]).map(([k,t])=>`<button class="${view===k?'on':''}" onclick="view='${k}';R()">${t}</button>`).join('');
document.getElementById('v').innerHTML=view==='piatti'?pPiatti():view==='haccp'?pHaccp():view==='ing'?pIng():view==='imp'?pImp():view==='rev'?pRev():view==='fmt'?pFmt():view==='fatt'?pFatt():view==='guida'?pGuida():view==='admin'?pAdmin():pPar();fotoHydrate()}
function pIng(){const miss=S.ing.filter(i=>!i.price).length;
const rows=S.ing.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(!onlyMiss||!i.price)).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<tr><td><input value="${esc(i.name)}" onchange="ing('${i.id}').name=cap(this.value);R()"></td>
<td><input type="number" step="0.01" min="0" value="${i.price??''}" placeholder="€" onchange="ing('${i.id}').price=this.value===''?null:+this.value;R()"></td>
<td><select onchange="ing('${i.id}').unit=this.value;R()"><option value="kg" ${i.unit==='kg'?'selected':''}>€/kg</option><option value="pz" ${i.unit==='pz'?'selected':''}>€/pz</option><option value="conf" ${i.unit==='conf'?'selected':''}>€/confezione</option></select></td><td>${i.unit==='conf'?`<input type="number" min="1" value="${i.conf??''}" placeholder="g" onchange="ing('${i.id}').conf=this.value===''?null:+this.value;R()"> g`:''}</td>
<td>${i.unit==='pz'?'<span class="mu">–</span>':`<input type="number" min="0" step="1" style="width:64px" value="${i.sw??''}" placeholder="g" title="Grammi di scarto" onchange="ing('${i.id}').sw=this.value===''?null:+this.value;R()"> g su <input type="number" min="1" step="1" style="width:70px" value="${i.sg??''}" placeholder="${i.unit==='conf'&&+i.conf?i.conf:1000}" title="Grammi lordi di riferimento (se vuoto: ${i.unit==='conf'&&+i.conf?'peso confezione':'1000 g'})" onchange="ing('${i.id}').sg=this.value===''?null:+this.value;R()"> g ${scP(i)?`<b>= ${scP(i).toFixed(1).replace('.',',')}%</b>`:''}`}</td>
<td><select onchange="ing('${i.id}').iva=+this.value;R()">${ivaOpt(i.iva)}</select></td><td>${pkg(i)}</td><td>${!i.price?'<span class="w">manca prezzo</span>':i.unit==='conf'&&!+i.conf?'<span class="w">manca peso</span>':i.unit==='pz'?eur(uc(i))+'/pz':fm(uc(i))+' €/g'+(scP(i)?'<div class="mu">con scarto '+scP(i).toFixed(1).replace('.',',')+'%</div>':'')}</td><td class="mu">${used(i.id)} piatti</td><td><button class="x" onclick="delIng('${i.id}')">✕</button></td></tr>`).join('');
return`<div class="row"><input id="s" placeholder="Cerca ingrediente…" value="${esc(q)}" oninput="q=this.value.toLowerCase();R();document.getElementById('s').focus()"><label><input type="checkbox" ${onlyMiss?'checked':''} onchange="onlyMiss=this.checked;R()">Solo senza prezzo (${miss})</label>
<button class="b" onclick="addIng()">+ Nuovo ingrediente</button></div><div class="card sc"><table><tr><th>Ingrediente</th><th>Prezzo</th><th>Unità</th><th>Peso confezione</th><th>Scarto (g su peso lordo)</th><th>IVA acquisto</th><th>Prezzo al kg</th><th>Costo al g (IVA ${S.p.useIva?'incl.':'escl.'})</th><th></th><th></th></tr>${rows}</table></div>`}
function addIng(){askText('Nome ingrediente',n=>{S.ing.push({id:'i'+Date.now(),name:cap(n),price:null,unit:'kg',iva:10});q='';R()})}
function delIng(id){const u=used(id);ask(u?`Usato in ${u} piatti: verrà tolto anche da lì. Eliminare?`:'Eliminare?',()=>{S.ing=S.ing.filter(i=>i.id!==id);S.dishes.forEach(d=>d.lines=d.lines.filter(l=>l.ing!==id));R()})}
const catSelect=d=>`<label>Categoria <select onchange="dish('${d.id}').cat=this.value;pcat=this.value;R()">${PC.map(([k,t])=>`<option value="${k}" ${catOf(d)===k?'selected':''}>${t}</option>`).join('')}</select></label>`;
function sInfo(d){const c=calc(d);let g=0,pz=0;d.lines.forEach(l=>{const i=ing(l.ing);if(!i)return;if(i.unit==='pz')pz++;else g+=+l.qty||0});const por=+d.por||0;return{c:c.c,g,pz,por,kg:g?c.c/g*1000:NaN,pc:g&&por?c.c/g*por:NaN,n:g&&por?g/por:NaN,miss:c.miss,nog:c.nog}}
function sCard(d){const x=sInfo(d);return`<details class="card" ${open_===d.id?'open':''} ontoggle="if(this.open)open_='${d.id}'"><summary><b>${esc(d.name)}</b><span>${x.g} g totali · porzione ${x.por||'–'} g · costo porzione <b>${eur(x.pc)}</b>${x.miss?` <span class="w">${x.miss} senza prezzo</span>`:''}${x.nog?` <span class="w">${x.nog} senza grammi</span>`:''}</span></summary>
<div class="row" style="margin-top:8px"><label>Nome <input value="${esc(d.name)}" onchange="dish('${d.id}').name=this.value;R()"></label><label>Porzione (g) <input type="number" min="0" value="${d.por||''}" onchange="dish('${d.id}').por=+this.value;R()"></label>${catSelect(d)}</div>
${chk(d)}
<div class="mu">Peso totale <b>${x.g} g</b> · costo ingredienti ${eur(x.c)} · costo al kg ${eur(x.kg)} · porzioni ottenute ${isFinite(x.n)?x.n.toFixed(1).replace('.',','):'–'} · <b>costo per porzione ${eur(x.pc)}</b>${x.pz?' · <span class="w">gli ingredienti a pezzi contano nel costo ma non nel peso</span>':''}</div>
${tracBlock('dish',d.id)}
<div class="row" style="margin-top:8px"><button class="b" onclick="ask('Eliminare questo sugo?',()=>{delLots('dish','${d.id}');S.dishes=S.dishes.filter(x=>x.id!=='${d.id}');R()})">Elimina sugo</button></div></details>`}
function dCard(d){if(d.cat==='sughi')return sCard(d);const c=calc(d);const pr=d.cat==='primi';
const catSel=`<label>Categoria <select onchange="dish('${d.id}').cat=this.value;pcat=this.value;R()">${PC.map(([k,t])=>`<option value="${k}" ${catOf(d)===k?'selected':''}>${t}</option>`).join('')}</select></label>`;
const dough=pr?`<label>Tipo di pasta <select onchange="dish('${d.id}').pf=this.value;R()"><option value="">— scegli —</option>${[['secca','Pasta asciutta'],['fresca','Pasta fresca']].map(([k,t])=>`<optgroup label="${t}">${S.fmt.filter(f=>f.kind===k).sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<option value="${f.id}" ${d.pf===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</optgroup>`).join('')}</select></label><label>Grammi pasta <input type="number" min="0" value="${d.pg||''}" onchange="dish('${d.id}').pg=+this.value;R()"></label><button class="b" onclick="view='fmt';R()">Gestisci formati</button>`
:`<label>Impasto <select onchange="dish('${d.id}').imp=this.value;R()"><option value="none" ${d.imp==='none'?'selected':''}>Nessun impasto</option>${S.imps.map(m=>`<option value="${m.id}" ${d.imp!=='none'&&IM(d.imp).id===m.id?'selected':''}>${esc(m.name)} · ${m.type==='comprato'?'comprato':m.type==='pasta'?'pasta':'in casa'} · ${eur(impC(m))}</option>`).join('')}</select></label>`;
return`<details class="card" ${open_===d.id?'open':''} ontoggle="if(this.open)open_='${d.id}'"><summary><b>${esc(d.name)}</b><span>margine <b class="${c.mg>0?'ok':'bad'}">${eur(c.mg)}</b> · vendita ${eur(d.sale)}${c.miss?` <span class="w">${c.miss} senza prezzo</span>`:''}${c.nog?` <span class="w">${c.nog} senza grammi</span>`:''}</span></summary>
<div class="row" style="margin-top:8px"><label>Nome <input value="${esc(d.name)}" onchange="dish('${d.id}').name=this.value;R()"></label><label>Prezzo vendita € <input type="number" step="0.5" value="${d.sale}" onchange="dish('${d.id}').sale=+this.value;R()"></label>${catSel}${dough}</div>
${chk(d)}
${tracBlock('dish',d.id)}
<div class="row" style="margin-top:8px"><button class="b" onclick="ask('Eliminare il piatto?',()=>{delLots('dish','${d.id}');S.dishes=S.dishes.filter(x=>x.id!=='${d.id}');R()})">Elimina piatto</button></div>
<div class="mu">Costo ingredienti ${eur(c.c)} + ${pr?'pasta':'impasto'} ${eur(dc(d))} · costo totale con lavoro e scarto ${eur(c.tot)} · prezzo consigliato <b>${eur(c.rec)}</b> · margine attuale <b class="${c.mg>0?'ok':'bad'}">${eur(c.mg)}</b> · numero di pareggio <b>${isFinite(c.par)?Math.ceil(c.par):'–'}</b></div></details>`}

async function pinHash(i,pin){const b=new TextEncoder().encode('fc|'+i+'|'+pin);try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let x=5381;for(const c of b)x=((x<<5)+x+c)>>>0;return'x'+x}
function padInit(cv){const x=cv.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';cv._ink=false;let d=false,l=null;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}d=true;l=pt(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(l[0]+.1,l[1]+.1);x.stroke()};
cv.onpointermove=e=>{if(!d)return;e.preventDefault();const q=pt(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(q[0],q[1]);x.stroke();l=q;cv._ink=true};

cv.clear=()=>{x.clearRect(0,0,cv.width,cv.height);cv._ink=false}}

function shrink(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let m=1100,q=.68,out='';for(let t=0;t<5;t++){const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<380000)break;m*=.8;q-=.08}URL.revokeObjectURL(u);ok(out)};im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('Immagine non leggibile'))};im.src=u})}

function pGuida(){
const go=(v,t)=>`<button class="b" onclick="view='${v}';R();window.scrollTo(0,0)">Vai a ${t}</button>`;
const sec=(open,t,body)=>`<details class="card" ${open?'open':''}><summary><b>${t}</b></summary><div style="margin-top:8px">${body}</div></details>`;
const ol=a=>`<ol style="margin:6px 0;padding-left:20px">${a.map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ol>`;
const sync=(typeof syOn==='function'&&syOn())?"<p>Accedi con l'email e la password che ti ha creato il supervisore. I dati sono salvati nel tuo account e si aggiornano da soli su tutti i dispositivi in cui accedi. Premi <b>Esci</b> in alto per uscire: i dati restano nel tuo account e vengono tolti da questo dispositivo.</p>":'<p>I dati si salvano automaticamente nel browser di questo dispositivo. Su un altro dispositivo (telefono, iPad, computer) partirai da dati separati. Se cancelli i dati del browser, li perdi.</p>';
return`<div class="card"><b>Istruzioni per l'uso</b><p class="mu" style="margin:6px 0 0">Ordine consigliato: <b>1 Parametri</b> → <b>2 Ingredienti</b> → <b>3 Impasto e Formati pasta</b> → <b>4 Piatti</b> → <b>5 Fatturato</b>. Ogni modifica si salva da sola: dopo aver scritto un numero premi Invio o tocca fuori dal campo, così si aggiorna il calcolo. Apri ogni sezione qui sotto per i passaggi.</p></div>`
+sec(true,'1. Parametri: costi e ricarichi',`<p>${go('par','Parametri')}</p>`+ol(['<b>Costi mensili dell\'attività</b>: scrivi gli importi di luce, dipendenti, gas, affitto, acqua, spazzatura e altro. Per ogni voce scegli <b>mensile</b> o <b>annuale</b>: se annuale, il programma divide per 12.','<b>Altri costi mensili</b>: telefono, e-commerce, commercialista, HACCP, consulente del lavoro, software fatturazione, pubblicità (ads, volantini, altro). Per ogni voce puoi scegliere l\'IVA (nessuna, 4%, 10%, 22%) che viene sommata all\'importo. Anche qui puoi scegliere importo <b>mensile</b> o <b>annuale</b> (se annuale viene diviso per 12).','<b>Ore e lavoro</b>: giorni lavorativi al mese, ore giornaliere e minuti di lavoro per pietanza. Il programma calcola da solo il costo del lavoro per ogni pietanza.','<b>Commissioni piattaforme</b>: per Glovo, Just Eat, Deliveroo, E-commerce personale, The Fork e una piattaforma libera (scrivi tu il nome) inserisci la commissione %, l\'eventuale percentuale fissa aggiuntiva e, se serve, spunta <b>+ IVA 22%</b>.','<b>IVA, scarto e ricarico</b>: l\'interruttore per calcolare i costi con l\'IVA di acquisto, lo scarto % (perdite e sprechi) e il ricarico (moltiplicatore per il prezzo consigliato, ad esempio 2,5).']))
+sec(false,'2. Ingredienti: prezzi di acquisto',`<p>${go('ing','Ingredienti')}</p>`+ol(['Per ogni ingrediente scegli l\'unità: <b>€/kg</b> (scrivi il prezzo al kg), <b>€/pz</b> (prezzo del singolo pezzo) oppure <b>€/confezione</b>.','Con <b>€/confezione</b> scrivi il prezzo della confezione e il <b>peso in grammi</b> (ad esempio 375): il programma calcola da solo il prezzo al kg e il costo al grammo.','Scegli l\'<b>IVA di acquisto</b> (4%, 10% o 22%): il costo al grammo mostrato la include.','Con <b>+ Nuovo ingrediente</b> aggiungi un nome; per rinominarlo modifica il testo; con ✕ lo elimini. Il nome inizia sempre con la maiuscola.','Spunta <b>Solo senza prezzo</b> per trovare gli ingredienti da completare: finché hanno l\'avviso giallo "manca prezzo" costano 0 nei piatti.']))
+sec(false,'3. Impasto',`<p>${go('imp','Impasto')}</p>`+ol(['In alto ci sono i pulsanti degli impasti. Scegli quello da compilare, oppure aggiungine con <b>+ Impasto in casa</b> o <b>+ Impasto comprato</b>.','<b>Impasto in casa</b>: per farina e olio scegli il tipo dai menu (fino a 4 righe ciascuno); per acqua, sale, lievito, latte e uova scrivi i grammi. Inserisci i <b>grammi totali</b> dell\'intera preparazione (ad esempio 1000 g di farina) e il <b>prezzo al kg</b>. Imposta il <b>peso del panetto</b>: vedi il costo per panetto.','<b>Impasto comprato</b> (senza glutine, pinsa, pane da hamburger, pane da hot dog, pane kebab): scrivi il peso del panetto, scegli come inserire il prezzo (<b>al panetto</b>, <b>al kg</b> o <b>al cartone</b> con il numero di panetti) e l\'IVA.','<b>Pasta asciutta</b> e <b>Pasta fresca</b>: scegli il formato dal menu e scrivi i <b>grammi per porzione</b>. I formati si creano nella scheda <b>Formati pasta</b>.']))
+sec(false,'4. Formati pasta',`<p>${go('fmt','Formati pasta')}</p>`+ol(['Premi <b>+ Formato pasta asciutta</b> o <b>+ Formato pasta fresca</b> e scrivi il nome (ad esempio Spaghetti).','Nella tabella scrivi il <b>prezzo al kg</b> e scegli l\'<b>IVA</b>: vedi il costo al grammo.','Il formato compare nel menu dell\'impasto Pasta asciutta o Pasta fresca, secondo il tipo scelto.']))
+sec(false,'5. Piatti',`<p>${go('piatti','Piatti')}</p>`+ol(['Premi <b>+ Nuovo piatto</b> e scrivi il nome: il piatto si apre da solo.','Nell\'elenco <b>spunta gli ingredienti</b> del piatto e, accanto a ognuno, scrivi i <b>grammi</b> (o i pezzi). Usa "Filtra ingredienti" per trovarli.','Scegli l\'<b>Impasto</b> dal menu (con il costo per panetto) e scrivi il <b>prezzo di vendita</b>.','Nella riga del piatto vedi <b>margine</b> e <b>prezzo di vendita</b>. Aprendolo trovi anche costo ingredienti, costo dell\'impasto, costo totale (con lavoro e scarto), <b>prezzo consigliato</b> (costo totale × ricarico) e <b>numero di pareggio</b>.','Gli avvisi gialli "senza prezzo" o "senza grammi" indicano dati mancanti: il costo del piatto è sottostimato finché non li completi.','Se cambi un prezzo in Ingredienti o in Impasto, tutti i piatti che lo usano si ricalcolano da soli.']))
+sec(false,'6. Fatturato',`<p>${go('rev','Fatturato')}</p>`+ol(['Scegli la <b>data</b> e scrivi gli incassi di quel giorno nelle caselle: Glovo, Just Eat, Deliveroo, E-commerce, The Fork, la piattaforma libera (scrivi il nome), Telefono, Asporto, Tavoli. Lascia vuote quelle senza incassi. Premi <b>Salva giornata</b>.','Per le piattaforme puoi, solo per quella giornata, spuntare <b>senza commissione</b>, scrivere una <b>commissione %</b> diversa o attivare l\'<b>IVA 22%</b>.','Con i bottoni <b>Giorni, Settimane, Mesi</b> vedi i totali, le commissioni e il netto. Nei mesi trovi anche <b>Dopo costi fissi</b>, che toglie i costi mensili di Parametri.','Per correggere una giornata premi ✎ nell\'elenco dei giorni (o scegli di nuovo la data), cambia gli importi e salva di nuovo.']))
+sec(false,'7. Fatture di acquisto',`<p>${go('fatt','Fatture di acquisto')}</p>`+ol(['Si apre anche da <b>Parametri → Carica e consulta le fatture</b>.','Premi il campo di caricamento e scegli uno o più file: fatture elettroniche <b>XML</b>, <b>.p7m</b> o un <b>ZIP</b> con più fatture (lettura precisa), oppure una <b>foto</b> della fattura. I PDF non sono supportati.','Per scaricare le fatture dal cassetto fiscale dell\'Agenzia delle Entrate apri in questa pagina la sezione <b>Scarica le fatture dal cassetto fiscale</b>: ci sono i passaggi.','Per far arrivare le fatture da sole dal tuo servizio di fatturazione (solo con la sincronizzazione online) apri la sezione <b>Collega un servizio di fatturazione</b>: ci sono i passaggi. Le fatture in arrivo compaiono con l\'etichetta <b>nuova</b>.','Compare la scheda <b>Da verificare e salvare</b>: controlla fornitore, numero, data e tutte le righe con quantità e prezzi, correggi ciò che serve, poi premi <b>Salva fattura</b>.','Le fatture salvate si cercano per fornitore, numero o prodotto, si aprono per vedere le righe e si possono eliminare.']))
+sec(false,'8. Salvataggio e altri dispositivi',sync)
+sec(false,'9. Categorie dei piatti e tracciabilità',ol(['In <b>Piatti</b> scegli la categoria in alto: Antipasti, Primi piatti, Secondi piatti, Contorni, Pizze, Panini, Fritti, Altri piatti. Il pulsante <b>+ Nuovo piatto</b> aggiunge il piatto nella categoria aperta; con il menu <b>Categoria</b> dentro al piatto lo sposti.','Nei <b>Primi piatti</b> scegli il <b>Tipo di pasta</b> (i formati si inseriscono nella scheda <b>Formati pasta</b>) e i grammi: il costo della pasta entra nel costo del piatto. Negli altri piatti l\'impasto è facoltativo (<i>Nessun impasto</i>).','Negli <b>Ingredienti</b>, accanto a ogni voce, scrivi lo <b>scarto in grammi</b> e su quanti grammi lordi (es. 200 g su 1000 g = 20%): il costo al grammo sale di conseguenza in tutti i piatti. Per le confezioni, se lasci vuoto, il riferimento è il peso della confezione. Se usi anche lo scarto generale nei Parametri, i due si sommano.','In <b>HACCP</b> trovi tre sezioni: <b>Tracciabilità</b>; <b>Temperature frigo</b> (aggiungi fino a 20 frigoriferi con i loro limiti, scegli il giorno, scrivi la temperatura e scatta la foto del display: fuori limite diventa rosso); <b>Sanificazione</b> (scegli area, prodotto e operatore, poi l\'operatore conferma con PIN e firma).','In <b>Sugo</b> spunta gli ingredienti e scrivi i grammi: vedi peso totale, costo al kg e, indicando i grammi della <b>Porzione</b>, il costo per porzione.','In <b>Secondi piatti</b>, sotto i piatti, trovi le sottocategorie, per esempio <b>Sughi e salse</b>: premi <b>+ Aggiungi</b> per inserire una voce (Ragù, Besciamella…) e <b>+ Nuova sottocategoria</b> per crearne altre.','Dentro ogni piatto o voce premi <b>+ Aggiungi lotto</b>: scegli data di produzione e di scadenza dal calendario, l\'operatore (1–10), eventuali note e scatta o carica la <b>foto dell\'etichetta</b>. Con <b>Rinomina operatori</b> dai un nome a ogni numero e, col pulsante <b>Firma</b>, ogni operatore sceglie un PIN di 4 cifre e disegna la sua firma una volta sola. Nel lotto l\'operatore tocca <b>Firma</b>, scrive il PIN e la firma compare con data e ora (se cambi operatore o date, va rifirmato).','La scheda <b>HACCP → Tracciabilità</b> riassume tutti i lotti ordinati per scadenza: in rosso i scaduti, in giallo quelli che scadono entro 2 giorni.']))+sec(false,'10. Consigli e attenzione',ol(['Parti dagli ingredienti più usati: completa prima i loro prezzi.','Aggiorna i prezzi quando cambiano i fornitori: i costi dei piatti si aggiornano da soli.','Controlla ogni tanto gli avvisi gialli (prezzo, grammi, peso della confezione).','Il pulsante <b>Ripristina dati iniziali</b> in Parametri cancella tutti i dati inseriti: usalo solo se vuoi ricominciare da capo.']))+(isAdm()?sec(false,'11. Pannello supervisore',ol(['Apri la scheda <b>👑 Supervisore</b>: vedi tutti gli account con stato, ultimo accesso, numero di piatti e fatture e fatturato del mese.','<b>Aggiungi nuovo ristorante</b>: scrivi nome, città, email (che sarà il nome utente) e una password di almeno 8 caratteri (puoi usare <b>Genera</b>). Premi <b>+ Aggiungi</b>: compaiono le credenziali da comunicare al ristorante, con il pulsante <b>Copia</b>.','<b>Disattiva</b> stacca l\'accesso: il ristorante viene fatto uscire entro pochi istanti e non può più entrare, ma i dati restano salvati. <b>Riattiva</b> ripristina l\'accesso.','<b>Password</b> imposta una nuova password (anche generata). <b>✕</b> elimina in modo definitivo account e dati.'].concat(isSup()?['<b>Supervisore minus</b>: nel modulo scegli <i>Tipo → Supervisore minus</i> per creare un collaboratore con lo stesso pannello. Nella riga del minus premi <b>Permessi</b> e spunta ciò che può fare: creare account, disattivare/riattivare, cambiare password, eliminare, vedere solo i ristoranti che ha creato lui. Un minus non può mai toccare te né altri minus.']:['Le operazioni che non vedi (pulsanti assenti) non ti sono state concesse dal supervisore.']))):'')}
