<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Food Cost</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--fg:#1f1d1a;--mu:#6e6a63;--card:#fff;--bd:#e3ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#fef3c7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--fg:#f0ece6;--mu:#9d978d;--card:#211f1c;--bd:#37332e;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#3a3012}}
:root[data-theme="dark"]{--bg:#171513;--fg:#f0ece6;--mu:#9d978d;--card:#211f1c;--bd:#37332e;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#3a3012}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 10px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
details>summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.w{background:var(--warn);padding:1px 6px;border-radius:5px;font-size:12px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
label{display:flex;gap:6px;align-items:center}
@media(max-width:600px){main{padding:8px}h1{font-size:18px}nav button,.b{padding:8px 10px}input,select{font-size:16px}td,th{padding:4px}.card{padding:8px}input[type=number]{width:80px}details>summary{gap:4px}}
</style></head><body><main>
<h1>🍕 Food Cost</h1>
<div class="row"><button class="b" id="sbtn" onclick="logout()">Esci</button><span class="mu" id="sst"></span></div>
<nav id="nav"></nav><div id="v"></div></main>
<script>
const D={"ing": [], "dishes": [], "p": {"useIva": true, "iva": 10, "scarto": 10, "ricarico": 2.5}};let dq='',S=null,view=(()=>{try{return sessionStorage.getItem('fcs_view')||'piatti'}catch(e){return'piatti'}})(),open_=null,q='',onlyMiss=false;
try{S=JSON.parse(localStorage.getItem('fcs1'))}catch(e){}
if(!S||!S.ing)S=JSON.parse(JSON.stringify(D));
const CATS=[['farina','Farina',4],['acqua','Acqua',1],['olio','Olio',4],['sale','Sale',1],['lievito','Lievito',1],['latte','Latte',1],['uova','Uova',1]];
S.p=Object.assign({luce:0,dip:0,gas:0,affitto:0,minuti:6,giorni:26,ore:10,acqua:0,spazz:0,altro:0,glovo:0,justeat:0,deliveroo:0,ecom:0,fork:0,extra:0,forkF:0,extraF:0,extraName:'',glovoF:0,justeatF:0,deliverooF:0,ecomF:0,ctel:0,cecom:0,ccomm:0,chaccp:0,ccons:0,cfatt:0,cads:0},S.p);if(!S.rev)S.rev={};
const totC=()=>['luce','dip','gas','affitto','acqua','spazz','altro','ctel','cecom','ccomm','chaccp','ccons','cfatt','cads'].reduce((s,k)=>s+(+S.p[k]||0)*(S.p[k+'A']?1/12:1)*(1+(+S.p[k+'I']||0)/100),0),eff=c=>{const x=(+S.p[c]||0)+(+S.p[c+'F']||0);return S.p[c+'V']?x*1.22:x},oreM=()=>S.p.giorni*S.p.ore,cOr=()=>oreM()?totC()/oreM():0,lav=()=>cOr()/60*S.p.minuti;
if(!S.imp)S.imp={peso:220,lines:[]};
if(!S.imp.slots){const A={farina:['Farina',null,0],acqua:['Acqua',null,0],olio:['Olio',null,0],sale:['Sale',null,0],lievito:['Lievito',null,0],latte:['Latte',null,0],uova:['Uova',null,0]};
S.imp.slots={};CATS.forEach(([c,,n])=>{const[nm,p,q]=A[c];let i=S.ing.find(x=>x.name.trim().toLowerCase()===nm.toLowerCase());if(!i){i={id:'i'+nm.toLowerCase(),name:nm,price:p,unit:'kg'};S.ing.push(i)}else if(!i.price&&p)i.price=p;
const old=(S.imp.lines||[]).find(l=>l.ing===i.id);S.imp.slots[c]=Array.from({length:n},(_,k)=>k?{ing:'',qty:0}:{ing:i.id,qty:old?old.qty:q})});delete S.imp.lines}
if(!S.imps)S.imps=[Object.assign({id:'m0',name:'Impasto classico',type:'ricetta',mode:'pz',price:null,box:1},S.imp)];
if(!S.impSeed){['Senza glutine','Pinsa'].forEach((n,k)=>{if(!S.imps.some(m=>m.name.toLowerCase()===n.toLowerCase())){const m={id:'ms'+k,name:n,type:'comprato',peso:220,mode:'pz',price:null,box:1,slots:{}};CATS.forEach(([c])=>m.slots[c]=S.imps[0].slots[c].map(s=>({ing:s.ing,qty:0})));S.imps.push(m)}});S.impSeed=1}
if(!S.impSeed2){[['Pane da hamburger',null],['Pane da hot dog',null],['Pane kebab',null]].forEach(([n,p],k)=>{if(!S.imps.some(m=>m.name.toLowerCase()===n.toLowerCase())){const m={id:'mp'+k,name:n,type:'comprato',peso:0,mode:'pz',price:p,box:1,slots:{}};CATS.forEach(([c])=>m.slots[c]=S.imps[0].slots[c].map(s=>({ing:s.ing,qty:0})));S.imps.push(m)}});S.impSeed2=1}
if(!S.fmt)S.fmt=[];if(!S.fatt)S.fatt=[];
if(!S.impSeed3){[['Pasta asciutta','secca','mpa'],['Pasta fresca','fresca','mpf']].forEach(([n,k,id])=>{if(!S.imps.some(m=>m.id===id))S.imps.push({id,name:n,type:'pasta',kind:k,fmt:'',g:0,slots:{}})});S.impSeed3=1}
const cap=s=>{s=String(s).replace(/ +/g,' ').trim();return s.charAt(0).toUpperCase()+s.slice(1)};
{const AL={'friarelli':'friarielli','cipolla':'cipolle','pomodorini freschi':'pomodori freschi','spek':'speck','straciatella':'stracciatella 149g','scamorza aff.':'scamorza affumicata 140g'},seen={},map={},keep=[];
S.ing.forEach(i=>i.name=cap(i.name));
S.ing.slice().sort((a,b)=>(AL[a.name.toLowerCase()]?1:0)-(AL[b.name.toLowerCase()]?1:0)).forEach(i=>{const n=i.name.toLowerCase(),k=AL[n]||n;if(seen[k]){map[i.id]=seen[k].id;if(!seen[k].price&&i.price)seen[k].price=i.price}else{seen[k]=i;keep.push(i)}});
S.ing=keep;const mp=id=>map[id]||id;S.dishes.forEach(d=>d.lines.forEach(l=>l.ing=mp(l.ing)));S.imps.forEach(m=>CATS.forEach(([c])=>(m.slots[c]||[]).forEach(s=>{if(s.ing)s.ing=mp(s.ing)})))}
let curImp=null;const IM=id=>S.imps.find(m=>m.id===id)||S.imps[0];
const impL=m=>CATS.flatMap(([c])=>m.slots[c]).filter(l=>l.ing);
const impC=m=>{if(m.type==='pasta'){const f=S.fmt.find(x=>x.id===m.fmt);if(!f||!f.price)return 0;let p=+f.price;if(S.p.useIva)p*=1+(+f.iva||10)/100;return p/1000*(+m.g||0)}
if(m.type==='comprato'){let p=(+m.price||0)*(S.p.useIva?1+(+m.iva||10)/100:1);return m.mode==='kg'?p*(m.peso/1000):m.mode==='box'?p/(m.box||1):p}
let c=0,g=0;impL(m).forEach(l=>{const i=S.ing.find(x=>x.id===l.ing);if(i)c+=uc(i)*(+l.qty||0);g+=+l.qty||0});const n=g/(+m.peso||1);return n>0?c/n:0};
const save=()=>{try{localStorage.setItem('fcs1',JSON.stringify(S))}catch(e){}syncChanged()};
const eur=n=>isFinite(n)?n.toLocaleString('it-IT',{style:'currency',currency:'EUR'}):'–';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ing=id=>S.ing.find(x=>x.id===id);
const ivaOpt=v=>[4,10,22].map(x=>`<option value="${x}" ${(+v||10)===x?'selected':''}>${x}%</option>`).join('');
const pkg=i=>i.price&&i.unit==='kg'?eur(+i.price):i.price&&i.unit==='conf'&&+i.conf?eur(i.price/(i.conf/1000)):'';
const fm=n=>n.toLocaleString('it-IT',{minimumFractionDigits:4,maximumFractionDigits:4});
const uc=i=>{let p=+i.price||0;if(S.p.useIva)p*=1+(+i.iva||10)/100;return i.unit==='pz'?p:i.unit==='conf'?(+i.conf?p/+i.conf:0):p/1000};
function calc(d){let c=0,miss=0,nog=0;d.lines.forEach(l=>{const i=ing(l.ing);if(!i||!i.price)miss++;if(!+l.qty)nog++;if(i)c+=uc(i)*(+l.qty||0)});
const base=c+impC(IM(d.imp)),tot=(base+lav())*(1+S.p.scarto/100);
return{par:totC()/(base+lav()),c,miss,nog,tot,rec:tot*S.p.ricarico,fc:d.sale?base/d.sale:NaN,mg:d.sale-tot}}
const used=id=>S.dishes.filter(d=>d.lines.some(l=>l.ing===id)).length;
function R(){if(view==='admin'&&ME&&ME.role==='supervisor'&&Date.now()-admAt>20000){admAt=Date.now();admLoad()}save();CH.find(x=>x[0]==='extra')[1]=S.p.extraName||'Altra piattaforma';try{sessionStorage.setItem('fcs_view',view)}catch(e){}
document.getElementById('nav').innerHTML=(ME&&ME.role==='supervisor'?[['admin','👑 Supervisore']]:[]).concat([['piatti','Piatti'],['ing','Ingredienti'],['imp','Impasto'],['rev','Fatturato'],['fmt','Formati pasta'],['par','Parametri'],['guida','Istruzioni']]).map(([k,t])=>`<button class="${view===k?'on':''}" onclick="view='${k}';R()">${t}</button>`).join('');
document.getElementById('v').innerHTML=view==='piatti'?pPiatti():view==='ing'?pIng():view==='imp'?pImp():view==='rev'?pRev():view==='fmt'?pFmt():view==='fatt'?pFatt():view==='guida'?pGuida():view==='admin'?pAdmin():pPar()}
function pIng(){const miss=S.ing.filter(i=>!i.price).length;
const rows=S.ing.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(!onlyMiss||!i.price)).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<tr><td><input value="${esc(i.name)}" onchange="ing('${i.id}').name=cap(this.value);R()"></td>
<td><input type="number" step="0.01" min="0" value="${i.price??''}" placeholder="€" onchange="ing('${i.id}').price=this.value===''?null:+this.value;R()"></td>
<td><select onchange="ing('${i.id}').unit=this.value;R()"><option value="kg" ${i.unit==='kg'?'selected':''}>€/kg</option><option value="pz" ${i.unit==='pz'?'selected':''}>€/pz</option><option value="conf" ${i.unit==='conf'?'selected':''}>€/confezione</option></select></td><td>${i.unit==='conf'?`<input type="number" min="1" value="${i.conf??''}" placeholder="g" onchange="ing('${i.id}').conf=this.value===''?null:+this.value;R()"> g`:''}</td>
<td><select onchange="ing('${i.id}').iva=+this.value;R()">${ivaOpt(i.iva)}</select></td><td>${pkg(i)}</td><td>${!i.price?'<span class="w">manca prezzo</span>':i.unit==='conf'&&!+i.conf?'<span class="w">manca peso</span>':i.unit==='pz'?eur(uc(i))+'/pz':fm(uc(i))+' €/g'}</td><td class="mu">${used(i.id)} piatti</td><td><button class="x" onclick="delIng('${i.id}')">✕</button></td></tr>`).join('');
return`<div class="row"><input id="s" placeholder="Cerca ingrediente…" value="${esc(q)}" oninput="q=this.value.toLowerCase();R();document.getElementById('s').focus()"><label><input type="checkbox" ${onlyMiss?'checked':''} onchange="onlyMiss=this.checked;R()">Solo senza prezzo (${miss})</label>
<button class="b" onclick="addIng()">+ Nuovo ingrediente</button></div><div class="card sc"><table><tr><th>Ingrediente</th><th>Prezzo</th><th>Unità</th><th>Peso confezione</th><th>IVA acquisto</th><th>Prezzo al kg</th><th>Costo al g (IVA ${S.p.useIva?'incl.':'escl.'})</th><th></th><th></th></tr>${rows}</table></div>`}
function addIng(){askText('Nome ingrediente',n=>{S.ing.push({id:'i'+Date.now(),name:cap(n),price:null,unit:'kg',iva:10});q='';R()})}
function delIng(id){const u=used(id);ask(u?`Usato in ${u} piatti: verrà tolto anche da lì. Eliminare?`:'Eliminare?',()=>{S.ing=S.ing.filter(i=>i.id!==id);S.dishes.forEach(d=>d.lines=d.lines.filter(l=>l.ing!==id));R()})}
function pPiatti(){const opts=l=>S.ing.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}" ${i.id===l?'selected':''}>${esc(i.name)}</option>`).join('');
const list=S.dishes.filter(d=>!q||d.name.toLowerCase().includes(q)).map(d=>{const c=calc(d);const col=c.fc>0.35?'bad':'ok';
return`<details class="card" ${open_===d.id?'open':''} ontoggle="if(this.open)open_='${d.id}'"><summary><b>${esc(d.name)}</b><span>margine <b class="${c.mg>0?'ok':'bad'}">${eur(c.mg)}</b> · vendita ${eur(d.sale)}${c.miss?` <span class="w">${c.miss} senza prezzo</span>`:''}${c.nog?` <span class="w">${c.nog} senza grammi</span>`:''}</span></summary>
<div class="row" style="margin-top:8px"><label>Nome <input value="${esc(d.name)}" onchange="dish('${d.id}').name=this.value;R()"></label><label>Prezzo vendita € <input type="number" step="0.5" value="${d.sale}" onchange="dish('${d.id}').sale=+this.value;R()"></label><label>Impasto <select onchange="dish('${d.id}').imp=this.value;R()">${S.imps.map(m=>`<option value="${m.id}" ${IM(d.imp).id===m.id?'selected':''}>${esc(m.name)} · ${m.type==='comprato'?'comprato':m.type==='pasta'?'pasta':'in casa'} · ${eur(impC(m))}</option>`).join('')}</select></label></div>
${chk(d)}
<div class="row" style="margin-top:8px"><button class="b" onclick="ask('Eliminare il piatto?',()=>{S.dishes=S.dishes.filter(x=>x.id!=='${d.id}');R()})">Elimina piatto</button></div>
<div class="mu">Costo ingredienti ${eur(c.c)} + impasto ${eur(impC(IM(d.imp)))} · costo totale con lavoro e scarto ${eur(c.tot)} · prezzo consigliato <b>${eur(c.rec)}</b> · margine attuale <b class="${c.mg>0?'ok':'bad'}">${eur(c.mg)}</b> · numero di pareggio <b>${isFinite(c.par)?Math.ceil(c.par):'–'}</b></div></details>`}).join('');
return`<div class="row"><input id="s" placeholder="Cerca piatto…" value="${esc(q)}" oninput="q=this.value.toLowerCase();R();document.getElementById('s').focus()"><button class="b" onclick="addDish()">+ Nuovo piatto</button></div>${list}`}
const dish=id=>S.dishes.find(d=>d.id===id);
function addDish(){askText('Nome piatto',n=>{const d={id:'d'+Date.now(),name:n,sale:0,lines:[]};S.dishes.unshift(d);open_=d.id;q='';R()})}
function pPar(){const f=(k,t,s)=>`<label>${t} <input type="number" step="${s}" min="0" value="${S.p[k]}" onchange="S.p.${k}=+this.value;R()"></label>`;
return`<div class="card"><b>Fatture di acquisto</b><div class="row" style="margin-top:8px"><button class="b" onclick="view='fatt';R()">📄 Carica e consulta le fatture</button><span class="mu">${S.fatt.length} salvate</span></div></div>
<div class="card"><b>Costi mensili dell'attività</b><div class="row" style="margin-top:8px">${[['luce','Luce'],['dip','Dipendenti'],['gas','Gas'],['affitto','Affitto'],['acqua','Acqua'],['spazz','Spazzatura'],['altro','Altro']].map(([k,l])=>costBox(k,l,false)).join('')}</div><div class="mu">Totale costi mensili <b>${eur(totC())}</b></div></div>
<div class="card"><b>Altri costi mensili</b><div class="row" style="margin-top:8px">${[['ctel','Telefono'],['cecom','E-commerce'],['ccomm','Commercialista'],['chaccp','HACCP'],['ccons','Consulente del lavoro'],['cfatt','Software fatturazione'],['cads','Pubblicità (ads, volantini, altro)']].map(([k,l])=>costBox(k,l,true)).join('')}</div><div class="mu">Se scegli un'aliquota, l'IVA viene sommata all'importo. Le voci sono incluse nel totale dei costi mensili qui sopra, quindi entrano nel costo del lavoro per pietanza e nel calcolo "Dopo costi fissi".</div></div>
<div class="card"><b>Ore e lavoro</b><div class="row" style="margin-top:8px">${f('giorni','Giorni lavorativi',1)}${f('ore','Ore lavorative giornaliere',0.5)}${f('minuti','Minuti di lavoro per pietanza',1)}</div><div class="mu">Ore mensili ${oreM()} · costo orario ${eur(cOr())} · costo al minuto ${eur(cOr()/60)} · <b>costo lavoro per pietanza ${eur(lav())}</b></div></div>
<div class="card"><b>Commissioni piattaforme</b><div class="mu">Commissione sul fatturato, più una percentuale fissa aggiuntiva. Con la spunta si aggiunge l'IVA 22% sul totale.</div>${[['glovo','Glovo'],['justeat','Just Eat'],['deliveroo','Deliveroo'],['ecom','E-commerce personale'],['fork','The Fork'],['extra','Altra piattaforma']].map(([c,l])=>`<div class="row" style="margin-top:8px">${c==='extra'?`<input value="${esc(S.p.extraName||'')}" placeholder="Altra piattaforma: scrivi il nome" onchange="S.p.extraName=this.value.trim();R()" style="width:180px">`:`<b style="min-width:120px">${l}</b>`}${f(c,'Commissione %',0.5)}${f(c+'F','Fissa aggiuntiva %',0.5)}<label><input type="checkbox" ${S.p[c+'V']?'checked':''} onchange="S.p['${c+'V'}']=this.checked;R()">+ IVA 22%</label><span class="mu">totale <b>${eff(c).toFixed(2)}%</b></span></div>`).join('')}</div>
<div class="card"><b>IVA, scarto e ricarico</b><div class="row" style="margin-top:8px"><label><input type="checkbox" ${S.p.useIva?'checked':''} onchange="S.p.useIva=this.checked;R()">Calcola i costi con l'IVA di acquisto (si sceglie per ogni ingrediente)</label>${f('scarto','Scarto %',1)}${f('ricarico','Ricarico ×',0.1)}</div>
<p class="mu">Costo totale = (ingredienti + impasto + lavoro) × (1 + scarto). Prezzo consigliato = costo totale × ricarico. Food cost % = (ingredienti + impasto) / prezzo di vendita. Numero di pareggio = costi mensili / (ingredienti + impasto + lavoro), come nel foglio. I dati restano salvati in questo browser.</p>
<button class="b" onclick="ask('Ripristinare i dati iniziali? Cancella tutti i dati inseriti, anche sugli altri dispositivi se la sincronizzazione è attiva.',()=>{try{localStorage.removeItem('fcs1')}catch(e){}location.reload()})">Ripristina dati iniziali</button></div>`}
function setSl(c,k,f,v){IM(curImp).slots[c][k][f]=v;R()}
function addImp(type){askText('Nome impasto',n=>{const b=S.imps[0];const m={id:'m'+Date.now(),name:n,type,peso:220,mode:'pz',price:null,box:1,slots:{}};CATS.forEach(([c])=>m.slots[c]=b.slots[c].map(s=>({ing:s.ing,qty:0})));S.imps.push(m);curImp=m.id;R()})}
function delImp(){if(S.imps.length<2)return;ask('Eliminare questo impasto? I piatti che lo usano passeranno al primo impasto.',()=>{S.imps=S.imps.filter(m=>m.id!==curImp);curImp=S.imps[0].id;R()})}
function pImp(){const m=IM(curImp);curImp=m.id;

function creds(e,p,title){const txt='Food Cost\nLink: '+String(location.href).split('#')[0]+'\nEmail: '+e+'\nPassword: '+p;const o=dlg('<b>'+esc(title)+'</b><p class="mu">Comunica queste credenziali al ristorante. La password non verrà più mostrata (potrai comunque reimpostarla).</p><pre style="white-space:pre-wrap;word-break:break-all;font-size:13px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px">'+esc(txt)+'</pre><div class="row"><button class="b" id="cc">Copia</button><button class="b" id="cx">Chiudi</button></div>');o.querySelector('#cc').onclick=()=>{try{navigator.clipboard.writeText(txt)}catch(x){}};o.querySelector('#cx').onclick=()=>o.remove()}
async function admCreate(){const f=admF;if(!f.nome.trim()||!f.email.trim()||f.pw.length<8)return note('Scrivi nome, email e una password di almeno 8 caratteri.');admMsg="Creo l'account…";R();
try{const c={e:f.email.trim(),p:f.pw};await admCall({action:'create',nome:f.nome.trim(),citta:f.citta.trim(),email:c.e,password:c.p});admF={nome:'',citta:'',email:'',pw:''};admMsg='';await admLoad();creds(c.e,c.p,'Account creato')}catch(e){admMsg='';R();note(e.message)}}
function admToggle(u,on){const x=admFind(u);ask(on?'Riattivare l\'accesso di '+(x.nome||x.email)+'?':'Disattivare l\'accesso di '+(x.nome||x.email)+'? Non potrà più entrare; i suoi dati restano salvati.',async()=>{try{await rpc('fc_admin_set_enabled',{p_uid:u,p_enabled:on});await admLoad()}catch(e){note('Operazione non riuscita.')}})}
function admPw(u){const x=admFind(u);const o=dlg('<b>Nuova password</b><p class="mu">'+esc(x.email||'')+'</p><input id="np" style="width:100%;box-sizing:border-box;margin-bottom:8px" placeholder="Almeno 8 caratteri"><div class="row"><button class="b" id="ng">Genera</button><button class="b" id="ns">Salva</button><button class="b" id="nx">Annulla</button></div>');const i=o.querySelector('#np');o.querySelector('#ng').onclick=()=>{i.value=genPw()};o.querySelector('#nx').onclick=()=>o.remove();o.querySelector('#ns').onclick=async()=>{const p=i.value;if(p.length<8)return;o.remove();try{await admCall({action:'password',uid:u,password:p});creds(x.email,p,'Password cambiata')}catch(e){note(e.message)}}}
function admDel(u){const x=admFind(u);ask('Eliminare definitivamente l\'account di '+(x.nome||x.email)+' e tutti i suoi dati? Non si può annullare. Per bloccare solo l\'accesso usa Disattiva.',async()=>{try{await admCall({action:'delete',uid:u});await admLoad()}catch(e){note(e.message)}})}
function pAdmin(){if(!ME||ME.role!=='supervisor')return'<div class="card">Area riservata al supervisore.</div>';
const list=adm.filter(u=>!admQ||(u.nome+' '+u.email+' '+(u.citta||'')).toLowerCase().includes(admQ));
const act=adm.filter(u=>u.enabled).length,tot=adm.reduce((s,u)=>s+(+u.fatturato_mese||0),0);
const rows=list.map(u=>{const me=A&&u.uid===A.uid;return`<tr><td><b>${esc(u.nome||'—')}</b>${u.citta?'<div class="mu">'+esc(u.citta)+'</div>':''}</td><td>${esc(u.email)}</td><td>${u.role==='supervisor'?'<span class="w">supervisore</span> ':''}${u.enabled?'<b class="ok">Attivo</b>':'<b class="bad">Disattivato</b>'}</td><td class="mu">${dt(u.last_seen)}</td><td>${u.piatti}</td><td>${u.fatture}</td><td>${eur(+u.fatturato_mese||0)}</td><td>${me?'<span class="mu">(tu)</span>':`<button class="b" onclick="admToggle('${u.uid}',${!u.enabled})">${u.enabled?'Disattiva':'Riattiva'}</button> <button class="b" onclick="admPw('${u.uid}')">Password</button> <button class="x" title="Elimina" onclick="admDel('${u.uid}')">✕</button>`}</td></tr>`}).join('');
return`<div class="card"><b>Gestione ristoranti</b><div class="mu">Aggiungi clienti, monitora l'attività, abilita o disabilita l'accesso.</div></div>
<div class="card"><b>Aggiungi nuovo ristorante</b><div class="row" style="margin-top:8px"><label>Nome ristorante <input value="${esc(admF.nome)}" oninput="admF.nome=this.value"></label><label>Città <input value="${esc(admF.citta)}" oninput="admF.citta=this.value"></label></div>
<div class="row"><label>Email (nome utente) <input type="email" autocapitalize="off" value="${esc(admF.email)}" oninput="admF.email=this.value"></label><label>Password <input value="${esc(admF.pw)}" oninput="admF.pw=this.value" placeholder="min. 8 caratteri"></label><button class="b" onclick="admF.pw=genPw();R()">Genera</button></div>
<div class="row"><button class="b" onclick="admCreate()">+ Aggiungi</button><span class="mu">${esc(admMsg)}</span></div></div>
<div class="row"><input id="adq" placeholder="Cerca ristorante…" value="${esc(admQ)}" oninput="admQ=this.value.toLowerCase();R();document.getElementById('adq').focus()"><button class="b" onclick="admAt=Date.now();admLoad()">Aggiorna</button><span class="mu">${adm.length} account · ${act} attivi · fatturato del mese ${eur(tot)}</span></div>
<div class="card sc"><table><tr><th>Ristorante</th><th>Email</th><th>Stato</th><th>Ultimo accesso</th><th>Piatti</th><th>Fatture</th><th>Fatturato mese</th><th></th></tr>${rows||'<tr><td class="mu">Nessun account.</td></tr>'}</table></div>
<p class="mu">Disattivando un account il ristorante non può più entrare e i suoi dati restano salvati; riattivandolo torna tutto com'era. "Elimina" cancella account e dati in modo definitivo.</p>`}
function chk(d){const rows=S.ing.slice().sort((a,b)=>a.name.localeCompare(b.name)).filter(i=>!dq||i.name.toLowerCase().includes(dq)||d.lines.some(l=>l.ing===i.id)).map(i=>{const l=d.lines.find(x=>x.ing===i.id);
return`<tr><td><label><input type="checkbox" ${l?'checked':''} onchange="tog('${d.id}','${i.id}',this.checked)">${esc(i.name)}</label></td><td>${l?`<input type="number" min="0" value="${l.qty}" onchange="setQ('${d.id}','${i.id}',this.value)"> ${i.unit==='pz'?'pz':'g'}`:''}</td><td>${l?(i.price?eur(uc(i)*l.qty):'<span class="w">manca prezzo</span>'):''}</td></tr>`}).join('');
return`<input id="dq${d.id}" placeholder="Filtra ingredienti…" value="${esc(dq)}" oninput="dq=this.value.toLowerCase();R();document.getElementById('dq${d.id}').focus()" style="margin-bottom:6px"><div class="sc" style="max-height:360px;overflow-y:auto"><table><tr><th>Spunta gli ingredienti</th><th>Quantità</th><th>Costo</th></tr>${rows}</table></div>`}
const tgt=id=>id==='imp'?S.imp:dish(id);
function tog(d,i,on){const x=tgt(d);if(on)x.lines.push({ing:i,qty:0});else x.lines=x.lines.filter(l=>l.ing!==i);R()}
function setQ(d,i,v){tgt(d).lines.find(l=>l.ing===i).qty=+v;R()}
const SYNC={url:'https://eptteggggbhozaxdmzic.supabase.co',key:'sb_publishable_YwrYkOflmBo9Hyg2bdCykg_BKHDqk_v'};
const syOn=()=>!!(SYNC.url&&SYNC.key),sy={ver:0,last:'',busy:false,timer:null,msg:'',inb:false,tok:''};
let ME=null,adm=[],admMsg='',admQ='';
let A=null;try{A=JSON.parse(localStorage.getItem('fcs_auth')||'null');sy.ver=+localStorage.getItem('fcs_ver')||0;sy.last=localStorage.getItem('fcs_last')||''}catch(e){}
const base=()=>SYNC.url.replace(/\/$/,'');
async function authReq(path,body){const r=await fetch(base()+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:SYNC.key},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error_description||j.msg||'auth');e.status=r.status;throw e}return j}
function setSession(j){A={token:j.access_token,refresh:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)-60)*1000,email:(j.user&&j.user.email)||(A&&A.email)||'',uid:(j.user&&j.user.id)||(A&&A.uid)||''};try{localStorage.setItem('fcs_auth',JSON.stringify(A))}catch(e){}}
function lockOut(msg){['fcs1','fcs_ver','fcs_last','fcs_taken','fcs_auth','fcs_uid'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});try{sessionStorage.setItem('fcs_msg',msg||'Accesso disattivato dal supervisore.')}catch(e){}A=null;ME=null;clearTimeout(sy.timer);location.reload()}
function forceLogin(msg){A=null;try{localStorage.removeItem('fcs_auth')}catch(e){}showLogin(msg)}
async function token(){if(!A)throw new Error('noauth');if(Date.now()>A.exp){try{setSession(await authReq('token?grant_type=refresh_token',{refresh_token:A.refresh}))}catch(e){if(e.status>=400&&e.status<500)forceLogin('Sessione scaduta: accedi di nuovo.');throw e}}return A.token}
async function rpc(fn,body){const t=await token();const r=await fetch(base()+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SYNC.key,Authorization:'Bearer '+t},body:JSON.stringify(body||{})});if(r.status===401){forceLogin('Sessione scaduta: accedi di nuovo.');throw new Error('401')}if(!r.ok){const tx=await r.text().catch(()=>'');if(tx.includes('accesso_disattivato')){lockOut();throw new Error('disattivato')}throw new Error('http '+r.status)}return r.json()}
const note=m=>{const o=dlg('<p>'+esc(m)+'</p><button class="b" id="dn">OK</button>');o.querySelector('#dn').onclick=()=>o.remove()};
function choose(msg,opts){const o=dlg('<p>'+esc(msg)+'</p>'+opts.map((x,k)=>'<div style="margin-bottom:6px"><button class="b" style="width:100%" data-k="'+k+'">'+esc(x[0])+'</button></div>').join(''));o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.remove();const f=opts[+b.dataset.k][1];if(f)f()})}
function st(m){if(m!==undefined)sy.msg=m;const e=document.getElementById('sst');if(e)e.textContent=!syOn()||!A?'':'👤 '+A.email+' · '+(sy.msg||'attivo')}
const hasData=()=>S.dishes.length>0||S.fatt.length>0||S.ing.some(i=>i.price)||S.imps.some(m=>m.price)||Object.keys(S.rev).length>0;
function applyRemote(r){try{localStorage.setItem('fcs1',JSON.stringify(r.data));localStorage.setItem('fcs_ver',r.version);localStorage.setItem('fcs_last',JSON.stringify(r.data))}catch(e){}location.reload()}
function syncChanged(){if(!syOn()||!A)return;if(JSON.stringify(S)===sy.last)return;clearTimeout(sy.timer);sy.timer=setTimeout(push,1500);st('modifiche da sincronizzare…')}
async function push(){if(!A||sy.busy)return;sy.busy=true;st('sincronizzo…');
try{const snap=JSON.stringify(S),v=await rpc('fc_set',{p_data:S,p_version:sy.ver});
if(v>0){sy.ver=v;sy.last=snap;try{localStorage.setItem('fcs_ver',v);localStorage.setItem('fcs_last',snap)}catch(e){}st('aggiornato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}))}
else if(v===-1){sy.busy=false;return conflict()}
else st('errore: dati non accettati')}
catch(e){if(A){st('offline, riprovo…');clearTimeout(sy.timer);sy.timer=setTimeout(push,15000)}}
sy.busy=false}
async function conflict(){try{const r=await rpc('fc_get',{});if(!r){sy.ver=0;return push()}choose('Un altro dispositivo ha aggiornato i dati.',[['Usa i dati più recenti (perdi le modifiche di questo dispositivo)',()=>applyRemote(r)],['Sovrascrivi con i dati di questo dispositivo',()=>{sy.ver=r.version;push()}]])}catch(e){st('offline')}}
async function check(){if(!A||sy.busy)return;try{const r=await rpc('fc_get',{});if(r&&r.version>sy.ver){if(JSON.stringify(S)===sy.last)applyRemote(r);else conflict()}else{st();inboxCheck()}}catch(e){st('offline')}}
function showLogin(msg){let o=document.getElementById('lg');if(o)o.remove();o=document.createElement('div');o.id='lg';o.style.cssText='position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';
o.innerHTML='<div class="card" style="max-width:340px;width:100%"><h1 style="margin:0 0 8px">🍕 Food Cost</h1><p class="mu">Accedi per continuare.</p><input id="lgu" type="email" autocomplete="username" placeholder="Email (nome utente)" style="width:100%;box-sizing:border-box;margin-bottom:8px"><input id="lgp" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;margin-bottom:8px"><button class="b" id="lgb" style="width:100%">Accedi</button><p class="mu" id="lgm" style="margin-top:8px"></p></div>';
document.body.appendChild(o);const m=o.querySelector('#lgm');m.textContent=msg||'';
const go=async()=>{m.textContent='Accesso in corso…';try{await doLogin(o.querySelector('#lgu').value,o.querySelector('#lgp').value)}catch(e){m.textContent=e.disabled?'Accesso disattivato o non abilitato. Contatta il supervisore.':(e.status===400||e.status===401)?'Email o password non corretti.':'Impossibile accedere: controlla la connessione.'}};
o.querySelector('#lgb').onclick=go;o.querySelector('#lgp').onkeydown=e=>{if(e.key==='Enter')go()}}
async function doLogin(email,pw){const j=await authReq('token?grant_type=password',{email:String(email).trim(),password:pw});const uid=j.user&&j.user.id;let prev=null;try{prev=localStorage.getItem('fcs_uid')}catch(e){}
if(prev&&prev!==uid){['fcs1','fcs_ver','fcs_last','fcs_taken'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}})}
setSession(j);let me=null;try{me=await rpc('fc_me',{})}catch(e){A=null;try{localStorage.removeItem('fcs_auth')}catch(x){}throw e}
if(!me||!me.enabled){A=null;try{localStorage.removeItem('fcs_auth')}catch(e){}throw Object.assign(new Error('x'),{disabled:true})}
try{localStorage.setItem('fcs_uid',uid)}catch(e){}location.reload()}
async function logout(){let dirty=JSON.stringify(S)!==sy.last;if(dirty){await push();dirty=JSON.stringify(S)!==sy.last}
ask(dirty?'Attenzione: ci sono modifiche non ancora sincronizzate che andranno perse. Uscire comunque?':'Uscire? I dati vengono tolti da questo dispositivo e restano salvati nel tuo account.',()=>{['fcs1','fcs_ver','fcs_last','fcs_taken','fcs_auth','fcs_uid'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()})}
async function syncInit(){if(!syOn()){const b=document.getElementById('sbtn');if(b)b.style.display='none';return}st();if(!A)return;
try{ME=await rpc('fc_me',{});if(!ME||!ME.enabled){lockOut();return}if(ME.role==='supervisor')R()}catch(e){}
try{const r=await rpc('fc_get',{});
if(!r){sy.ver=0;sy.last='';await push()}
else if(!sy.last&&!sy.ver){if(!hasData()){applyRemote(r);return}
choose("Nel tuo account ci sono già dei dati. Cosa vuoi fare?",[["Usa i dati dell'account (sostituisce quelli di questo dispositivo)",()=>applyRemote(r)],["Sostituisci i dati dell'account con quelli di questo dispositivo",()=>{sy.ver=r.version;push()}]])}
else if(r.version>sy.ver){if(JSON.stringify(S)===sy.last)applyRemote(r);else conflict()}
else if(JSON.stringify(S)!==sy.last)push();
else{st();inboxCheck()}
try{sy.tok=await rpc('fc_token',{})}catch(e){}}catch(e){st('offline')}
setInterval(()=>{const t=document.activeElement&&document.activeElement.tagName;if(!document.hidden&&t!=='INPUT'&&t!=='SELECT')check()},45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()})}
if(syOn()&&!A){let m='';try{m=sessionStorage.getItem('fcs_msg')||'';sessionStorage.removeItem('fcs_msg')}catch(e){}showLogin(m)}else{R();syncInit()}
</script></body></html>
